<script>

// =================================
// EDITOR ENGINE
// =================================


let selectedElement = null;



// Select an element

function selectElement(element){


    if(selectedElement){

        selectedElement.classList.remove("selected");

    }


    selectedElement = element;

    selectedElement.classList.add("selected");


}




// Create poster element

function createElement(type, content, x, y, size = 35){


    let element = document.createElement("div");


    element.className = "poster-element";


    element.style.left = x + "px";

    element.style.top = y + "px";


    element.dataset.type = type;



    if(type === "text"){


        element.innerText = content;


        element.style.fontSize =
        size + "px";


        element.style.fontWeight =
        "bold";


    }




    if(type === "image"){


        let img =
        document.createElement("img");


        img.src = content;


        img.style.width =
        "250px";


        element.appendChild(img);


    }



    element.onclick = function(e){


        e.stopPropagation();


        selectElement(element);


    };



    makeDraggable(element);



    document
    .getElementById("canvas")
    .appendChild(element);



    return element;


}




// Drag elements

function makeDraggable(element){


    let offsetX;

    let offsetY;

    let dragging = false;



    element.onmousedown = function(e){


        selectElement(element);


        dragging = true;


        offsetX =
        e.offsetX;


        offsetY =
        e.offsetY;



    };





    document.onmousemove = function(e){


        if(!dragging)
        return;



        let canvas =
        document
        .getElementById("canvas")
        .getBoundingClientRect();



        let x =
        e.clientX -
        canvas.left -
        offsetX;



        let y =
        e.clientY -
        canvas.top -
        offsetY;



        element.style.left =
        x + "px";



        element.style.top =
        y + "px";



    };





    document.onmouseup = function(){


        dragging = false;


    };


}




// Add text

function addText(){


    createElement(

        "text",

        "NEW TEXT",

        100,

        100,

        35

    );


}




// Update selected text

function updateText(){


    if(!selectedElement)
    return;



    let input =
    document
    .getElementById("textInput");



    selectedElement.innerText =
    input.value;



}




// Resize text

function resizeSelected(amount){


    if(!selectedElement)
    return;



    let current =
    parseInt(
        window
        .getComputedStyle(selectedElement)
        .fontSize
    );



    selectedElement.style.fontSize =
    (current + amount) + "px";


}




// Upload image


document
.getElementById("imageUpload")
.onchange = function(e){



    let file =
    e.target.files[0];



    if(!file)
    return;



    let reader =
    new FileReader();



    reader.onload = function(event){


        createElement(

            "image",

            event.target.result,

            175,

            175

        );


    };



    reader.readAsDataURL(file);



};






// Delete selected element

document.addEventListener(
"keydown",
function(e){


    if(e.key === "Delete"){


        if(selectedElement){


            selectedElement.remove();


            selectedElement = null;


        }


    }


});





// Clear poster

function clearCanvas(){


    document
    .getElementById("canvas")
    .innerHTML = "";



    selectedElement = null;


}




// Click empty space removes selection

document
.getElementById("canvas")
.onclick=function(){


    if(selectedElement){


        selectedElement.classList.remove(
        "selected"
        );


    }


    selectedElement=null;


};

// Load selected template

function loadTemplate(number){



    clearCanvas();



    let template =
    templates[number];



    template.elements.forEach(item=>{


        createElement(

            item.type,

            item.text,

            item.x,

            item.y,

            item.size

        );


    });



}

// SAVE / LOAD / EXPORT
// =================================



// Save poster

function saveProject(){


    let poster =
    document
    .getElementById("canvas")
    .innerHTML;



    localStorage.setItem(
        "albumPoster",
        poster
    );


    alert("Poster saved!");

}





// Load poster

function loadProject(){


    let saved =
    localStorage.getItem(
        "albumPoster"
    );



    if(!saved)
    return;



    document
    .getElementById("canvas")
    .innerHTML =
    saved;



    document
    .querySelectorAll(".poster-element")
    .forEach(element=>{


        makeDraggable(element);


        element.onclick=function(e){

            e.stopPropagation();

            selectElement(element);

        };


    });



}





// Export PNG

function exportPoster(){


    let canvas =
    document.getElementById("canvas");



    let image =
    document.createElement("canvas");



    html2canvas(canvas)
    .then(function(result){


        let link =
        document.createElement("a");


        link.download =
        "album-poster.png";


        link.href =
        result.toDataURL();



        link.click();



    });



}
