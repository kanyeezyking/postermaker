<!DOCTYPE html>
<html lang="en">
<head>

    <title>Album Poster Generator</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; height: 100vh; background: #222; color: #fff; }
        #sidebar { width: 380px; background: #181818; padding: 20px; overflow-y: auto; border-right: 1px solid #333; }
        #sidebar h2 { margin-top: 0; font-size: 1.1rem; border-bottom: 1px solid #333; padding-bottom: 10px; color: #00ffcc; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 0.8rem; margin-bottom: 5px; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }
        .input-group input, .input-group select, .input-group textarea { width: 100%; padding: 10px; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 4px; font-family: inherit; }
        .input-group textarea { resize: vertical; min-height: 120px; }
        .input-group input:focus, .input-group select:focus, .input-group textarea:focus { outline: none; border-color: #00ffcc; }
        #downloadBtn { width: 100%; padding: 12px; background: #00ffcc; color: #000; border: none; font-weight: bold; border-radius: 4px; cursor: pointer; margin-top: 10px; text-transform: uppercase; letter-spacing: 1px; }
        #downloadBtn:hover { background: #00cca3; }
        #preview-container { flex-grow: 1; display: flex; justify-content: center; align-items: center; padding: 30px; overflow: auto; background: #111; }
        #canvas-wrapper { width: 595px; height: 842px; background: #fff; box-shadow: 0 10px 30px rgba(0,0,0,0.8); flex-shrink: 0; position: relative; overflow: hidden; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>
    <div id="sidebar">
        <h2>Poster Generator</h2>
        
        <div class="input-group">
            <label for="templateSelect">Select Template</label>
            <select id="templateSelect">
                <option value="1">Template 1: Swiss / Minimalist (Multi-Side)</option>
                <option value="2">Template 2: Y2K / Cyber Streetwear</option>
                <option value="3">Template 3: Vintage Vinyl Frame</option>
                <option value="4">Template 4: Editorial / Magazine Style</option>
                <option value="5">Template 5: Neo-Brutalist Grid</option>
                <option value="6">Template 6: MPC Sampler / Classic Hip-Hop</option>
                <option value="7">Template 7: Director's Cut Storyboard</option>
                <option value="8">Template 8: Chicago Soul / Vinyl Sleeve</option>
                <option value="9">Template 9: Modern Brutalist / Experimental</option>
                <option value="10">Template 10: Lyrical Typography Focus</option>
            </select>
        </div>

        <div class="input-group">
            <label for="artistName">Artist Name</label>
            <input type="text" id="artistName" value="ARTIST NAME">
        </div>

        <div class="input-group">
            <label for="albumTitle">Album Title</label>
            <input type="text" id="albumTitle" value="ALBUM TITLE">
        </div>

        <div class="input-group">
            <label for="producerName">Producer / Label</label>
            <input type="text" id="producerName" value="PRODUCER">
        </div>

        <div class="input-group">
            <label for="releaseYear">Release Year</label>
            <input type="text" id="releaseYear" value="2026">
        </div>

        <div class="input-group">
            <label for="catalogNo">Catalog Number</label>
            <input type="text" id="catalogNo" value="CAT-001">
        </div>

        <div class="input-group">
            <label for="spotifyCode">Spotify Code Text</label>
            <input type="text" id="spotifyCode" value="SPOTIFY CODE">
        </div>

        <div class="input-group">
            <label for="artworkUrl">Artwork Image URL</label>
            <input type="text" id="artworkUrl" placeholder="https://example.com/image.jpg">
        </div>

        <div class="input-group">
            <label for="tracklist">Tracklist (Type SIDE A, SIDE B, etc. for columns)</label>
            <textarea id="tracklist">SIDE A
Track One Title
Track Two Title
Track Three Title
SIDE B
Track Four Title
Track Five Title
Track Six Title</textarea>
        </div>

        <button id="downloadBtn">Download Poster</button>
    </div>

        function updatePoster() {
            const templateId = document.getElementById('templateSelect').value;
            const artist = document.getElementById('artistName').value;
            const title = document.getElementById('albumTitle').value;
            const producer = document.getElementById('producerName').value;
            const year = document.getElementById('releaseYear').value;
            const catalogNo = document.getElementById('catalogNo').value;
            const spotifyCode = document.getElementById('spotifyCode').value;
            const artworkUrl = document.getElementById('artworkUrl').value;
            const rawTrackText = document.getElementById('tracklist').value;
            const lines = rawTrackText.split('\n');

            let code = templates[templateId];

            // Generate automatic dynamic palette colors based on text length/hash
            let hash = (artist + title).split('').reduce((acc, char) => acc + char.charCodeAt(0), 0);
            let p1 = `#${((hash * 123) % 900 + 100)}`;
            let p2 = `#${((hash * 456) % 900 + 100)}`;
            let p3 = `#${((hash * 789) % 900 + 100)}`;
            let p4 = `#${((hash * 321) % 900 + 100)}`;

            // Parse Multi-Sides for Template 1
            let sides = [];
            let currentSide = { title: "SIDE A", tracks: [] };
            lines.forEach(line => {
                let trimmed = line.trim();
                if (!trimmed) return;
                if (trimmed.toUpperCase().startsWith("SIDE") || trimmed.toUpperCase().startsWith("VOL") || trimmed.toUpperCase().startsWith("PART")) {
                    if (currentSide.tracks.length > 0 || currentSide.title !== "SIDE A") {
                        sides.push(currentSide);
                    }
                    currentSide = { title: trimmed.toUpperCase(), tracks: [] };
                } else {
                    currentSide.tracks.push(trimmed);
                }
            });
            sides.push(currentSide);

            let dynamicSidesSvg = '';
            let startX = 40;
            let startY = 560;
            sides.forEach((side, sIdx) => {
                if (sIdx > 0 && sIdx % 3 === 0) {
                    startX = 40;
                    startY += 120;
                } else if (sIdx > 0) {
                    startX += 175;
                }
                
                dynamicSidesSvg += `<text x="${startX}" y="${startY}" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#111111">${side.title}</text>\n`;
                
                side.tracks.forEach((track, tIdx) => {
                    let tNum = (tIdx + 1).toString().padStart(2, '0');
                    let tY = startY + 18 + (tIdx * 16);
                    if (tY < 750) { // Keep inside poster bounds
                        dynamicSidesSvg += `<text x="${startX}" y="${tY}" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#444444">${tNum}. ${track}</text>\n`;
                    }
                });
            });

            // Standard track lists for other templates
            let allTracks = [];
            lines.forEach(l => {
                let t = l.trim();
                if (t && !t.toUpperCase().startsWith("SIDE") && !t.toUpperCase().startsWith("VOL")) {
                    allTracks.push(t);
                }
            });

            let svgGrid2 = '';
            let svgCenter = '';
            let svgEditorial = '';
            let svgBrutal = '';
            let htmlList = '';
            let htmlBrutal = '';
            let storyboardFrames = '';
            let inlineTracks = allTracks.join(' • ');

            allTracks.forEach((t, i) => {
                let num = (i + 1).toString().padStart(2, '0');
                
                if(i < 8) {
                    let x = i < 4 ? 50 : 300;
                    let y = 590 + ((i % 4) * 22);
                    svgGrid2 += `<text x="${x}" y="${y}" font-family="'Courier New', monospace" font-size="10" fill="#FFFFFF">${num}. ${t}</text>\n`;
                }
                htmlList += `${num}. ${t} <br>`;
                htmlBrutal += `<div class="track">${num}. ${t}</div>`;
                
                if(i < 8) svgCenter += `<text x="297" y="${475 + (i * 18)}" font-family="'Times New Roman', serif" font-size="10" fill="#2C221E" text-anchor="middle">${i+1}. ${t}</text>\n`;
                if(i < 8) svgEditorial += `<text x="310" y="${210 + (i * 25)}" font-family="Helvetica, sans-serif" font-size="9" fill="#FF4500">0${i+1}</text><text x="335" y="${210 + (i * 25)}" font-family="Helvetica, sans-serif" font-size="9" fill="#DDDDDD">${t}</text>\n`;
                if(i < 10) svgBrutal += `<text x="340" y="${195 + (i * 20)}" font-family="Courier, monospace" font-size="9" font-weight="bold" fill="#000000">${num}. ${t}</text>\n`;
                
                if(i < 6) {
                    storyboardFrames += `<div class="frame"><div class="frame-number">SCENE 0${i+1}</div><div class="frame-lyric">"${t}"</div><div class="frame-image"></div></div>\n`;
                }
            });

            code = code
                .replace(/{{ARTIST_NAME}}/g, artist)
                .replace(/{{ALBUM_TITLE}}/g, title)
                .replace(/{{PRODUCER}}/g, producer)
                .replace(/{{RELEASE_YEAR}}/g, year)
                .replace(/{{CATALOG_NO}}/g, catalogNo)
                .replace(/{{SPOTIFY_CODE}}/g, spotifyCode)
                .replace(/{{ARTWORK_URL}}/g, artworkUrl)
                .replace(/{{DYNAMIC_SIDES}}/g, dynamicSidesSvg)
                .replace(/{{PALETTE_1}}/g, p1)
                .replace(/{{PALETTE_2}}/g, p2)
                .replace(/{{PALETTE_3}}/g, p3)
                .replace(/{{PALETTE_4}}/g, p4)
                .replace(/{{TRACKLIST_SVG_GRID_2}}/g, svgGrid2)
                .replace(/{{TRACKLIST_SVG_CENTER}}/g, svgCenter)
                .replace(/{{TRACKLIST_SVG_EDITORIAL}}/g, svgEditorial)
                .replace(/{{TRACKLIST_SVG_BRUTALIST}}/g, svgBrutal)
                .replace(/{{TRACKLIST_HTML}}/g, htmlList)
                .replace(/{{TRACKLIST_HTML_BRUTALIST}}/g, htmlBrutal)
                .replace(/{{TRACKLIST_INLINE}}/g, inlineTracks)
                .replace(/{{STORYBOARD_FRAMES}}/g, storyboardFrames);

            const wrapper = document.getElementById('canvas-wrapper');
            if (code.includes('<svg')) {
                wrapper.innerHTML = code;
            } else {
                wrapper.innerHTML = '<iframe></iframe>';
                const iframe = wrapper.querySelector('iframe');
                iframe.contentWindow.document.open();
                iframe.contentWindow.document.write(code);
                iframe.contentWindow.document.close();
            }
        }

        // Download Button Functionality
        document.getElementById('downloadBtn').addEventListener('click', () => {
            const wrapper = document.getElementById('canvas-wrapper');
            let filename = document.getElementById('albumTitle').value.toLowerCase().replace(/[^a-z0-9]/g, '_') + '_poster';
            
            if (wrapper.querySelector('svg')) {
                const svgData = wrapper.innerHTML;
                const blob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename + '.svg';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            } else {
                const iframe = wrapper.querySelector('iframe');
                if (iframe) {
                    const htmlContent = iframe.contentWindow.document.documentElement.outerHTML;
                    const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = filename + '.html';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                }
            }
        });

        document.querySelectorAll('#sidebar input, #sidebar textarea, #sidebar select').forEach(el => {
            el.addEventListener('input', updatePoster);
            el.addEventListener('change', updatePoster);
        });

        window.onload = updatePoster;
    </script>
</body>
</html>
