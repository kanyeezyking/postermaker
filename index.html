<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Treatment & Poster Generator</title>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --text-main: #ffffff;
            --text-muted: #888888;
            --border-color: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- LAYOUT --- */
        #app-container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        #template-selector {
            width: 250px;
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            padding: 20px;
            overflow-y: auto;
        }

        .template-btn {
            display: block;
            width: 100%;
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 12px;
            margin-bottom: 10px;
            text-align: left;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .template-btn:hover, .template-btn.active {
            border-color: var(--text-main);
            color: var(--text-main);
            background-color: rgba(255, 255, 255, 0.05);
        }

        #preview-area {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #0a0a0a;
            overflow: auto;
            padding: 40px;
        }

        #art-board {
            width: 600px;
            height: 800px;
            background-color: #fff;
            color: #000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
        }

        #editor-sidebar {
            width: 350px;
            background-color: var(--panel-bg);
            border-left: 1px solid var(--border-color);
            padding: 20px;
            overflow-y: auto;
        }

        .sidebar-header {
            margin-bottom: 24px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .control-group { margin-bottom: 20px; }
        .control-group label {
            display: block;
            font-size: 12px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }
        .control-group input[type="text"],
        .control-group textarea {
            width: 100%;
            background-color: rgba(255,255,255,0.05);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px;
            border-radius: 4px;
            font-size: 14px;
        }
        .control-group textarea { resize: vertical; min-height: 80px; }
        .track-input-group { display: flex; margin-bottom: 8px; gap: 8px; }
        .btn-add { margin-top: 10px; padding: 8px 12px; background: #333; color: white; border: none; cursor: pointer; border-radius: 3px; font-size: 12px; text-transform: uppercase;}

        /* =========================================
           TEMPLATE 1: Grid Poster
           ========================================= */
        .tpl-grid-poster { 
            background-color: #f7f7f7; 
            color: #000; 
            padding: 30px 40px; 
            height: 100%; 
            display: flex; 
            flex-direction: column; 
            justify-content: flex-start; 
            gap: 14px;
        }
        .tpl-grid-poster .titles h2 { font-size: 16px; text-transform: uppercase; margin-bottom: 2px; color: #555; }
        .tpl-grid-poster .titles h1 { font-size: 34px; text-transform: uppercase; font-weight: 900; letter-spacing: -1px; line-height: 1.1; }
        .tpl-grid-poster .hero-artwork { 
            width: 100%; 
            aspect-ratio: 1; 
            max-height: 280px; 
            background-color: #121212; 
            border: 2px solid #000; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 11px; 
            font-weight: bold; 
            color: #888; 
        }
        .tpl-grid-poster .tracklist-section { display: flex; flex-direction: column; flex-grow: 1; }
        .tpl-grid-poster .tracklist-header { font-size: 10px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; color: #666; border-bottom: 1px solid #ccc; padding-bottom: 4px; }
        .tpl-grid-poster .tracklist { font-weight: bold; column-count: 2; column-gap: 30px; width: 100%; }
        .tpl-grid-poster .tracklist-item { break-inside: avoid; }

        /* =========================================
           TEMPLATE 2: Director's Cut
           ========================================= */
        .tpl-directors-cut { background-color: #1a1a1a; color: #dcdcdc; padding: 40px; font-family: monospace; height: 100%; display: flex; flex-direction: column;}
        .tpl-directors-cut .header h1 { text-align: center; font-size: 32px; letter-spacing: 4px; margin-bottom: 10px; text-transform: uppercase; }
        .tpl-directors-cut .header h2 { text-align: center; font-size: 12px; color: #888; border-bottom: 1px solid #444; padding-bottom: 20px; margin-bottom: 20px; text-transform: uppercase; }
        .tpl-directors-cut .concept { font-size: 12px; margin-bottom: 30px; line-height: 1.5; color: #aaa; }
        .tpl-directors-cut .scene-grid { display: flex; flex-direction: column; gap: 10px; flex-grow: 1;}
        .tpl-directors-cut .scene-row { display: flex; height: 90px; border: 1px solid #333; }
        .tpl-directors-cut .scene-text { flex: 2; padding: 10px; position: relative; background: #0a0a0a; }
        .tpl-directors-cut .scene-meta { color: #ff3333; font-size: 10px; position: absolute; top: 10px; left: 10px; }
        .tpl-directors-cut .scene-lyric { position: absolute; bottom: 10px; left: 10px; font-style: italic; font-size: 12px; }
        .tpl-directors-cut .scene-art { flex: 1; background: #2a2a2a; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #666; border-left: 1px solid #333; background-size: cover; background-position: center; }
        .tpl-directors-cut .footer { font-size: 10px; color: #666; margin-top: 20px; line-height: 1.5; text-transform: uppercase;}

        /* =========================================
           TEMPLATE 3: Vinyl Center Label
           ========================================= */
        .tpl-vinyl-center { background-color: #d2aa7a; color: #2c2519; padding: 30px; height: 100%; display: flex; flex-direction: column; }
        .tpl-vinyl-center .inner-border { border: 3px solid #2c2519; height: 100%; display: flex; flex-direction: column; align-items: center; padding: 40px; position: relative;}
        .tpl-vinyl-center h1 { font-family: Georgia, serif; font-size: 48px; font-style: italic; margin-bottom: 10px; }
        .tpl-vinyl-center h2 { font-size: 16px; text-transform: uppercase; letter-spacing: 2px; }
        .tpl-vinyl-center .record-circle { width: 350px; height: 350px; border-radius: 50%; border: 2px solid #2c2519; background-color: #e6dac3; margin: 40px 0; display: flex; align-items: center; justify-content: center; position: relative; background-size: cover; background-position: center;}
        .tpl-vinyl-center .spindle-hole { width: 25px; height: 25px; border-radius: 50%; border: 2px solid #2c2519; background-color: #d2aa7a; position: absolute; z-index: 2; }
        .tpl-vinyl-center .label-art-text { font-size: 10px; color: #888; position: absolute; bottom: 60px; text-transform: uppercase; background: rgba(230, 218, 195, 0.8); padding: 2px 5px;}
        .tpl-vinyl-center .track-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; font-size: 12px; font-weight: bold; width: 100%; text-align: center; border-top: 2px solid #2c2519; padding-top: 20px; position: absolute; bottom: 40px;}

        /* =========================================
           TEMPLATE 4: Red & Black Offset
           ========================================= */
        .tpl-offset { background-color: #ffffff; color: #000; height: 100%; position: relative; overflow: hidden; }
        .tpl-offset .huge-text { font-size: 180px; font-weight: 900; line-height: 0.7; letter-spacing: -5px; position: absolute; top: -20px; left: -10px; text-transform: uppercase; width: 120%; }
        .tpl-offset .red-box { position: absolute; top: 150px; right: 20px; width: 300px; background-color: #ff0000; color: #fff; padding: 25px; border: 4px solid #000; box-shadow: 10px 10px 0px #000; }
        .tpl-offset .red-box h2 { font-size: 24px; text-transform: uppercase; margin-bottom: 20px; }
        .tpl-offset .red-box ul { list-style: none; }
        .tpl-offset .red-box li { border-bottom: 1px solid rgba(255,255,255,0.3); padding: 6px 0; font-size: 12px; font-weight: bold; text-transform: uppercase; }
        .tpl-offset .black-box { position: absolute; bottom: 40px; left: 20px; width: 280px; height: 350px; background-color: #000; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; border: 4px solid #fff; box-shadow: 10px 10px 0px rgba(0,0,0,0.2); background-size: cover; background-position: center; }

        /* =========================================
           TEMPLATE 5: Lyrics Overlay
           ========================================= */
        .tpl-lyrics-bg { background-color: #0a0a2a; color: #fff; height: 100%; display: flex; flex-direction: column; position: relative; padding: 40px;}
        .tpl-lyrics-bg .bg-text { position: absolute; top: 20px; left: 20px; right: 20px; font-size: 14px; line-height: 1.2; color: rgba(255,255,255,0.05); text-transform: uppercase; text-align: justify; z-index: 1; }
        .tpl-lyrics-bg .center-card { background: #e0e0f8; color: #0a0a2a; padding: 40px; margin: auto; width: 85%; text-align: center; z-index: 2; border-radius: 4px;}
        .tpl-lyrics-bg .center-card h1 { font-size: 36px; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px; font-weight: 900;}
        .tpl-lyrics-bg .center-card h3 { font-size: 14px; text-transform: uppercase; margin-bottom: 30px; font-weight: 600;}
        .tpl-lyrics-bg .art-square { width: 100%; aspect-ratio: 1; border: 1px solid #0a0a2a; display: flex; align-items: center; justify-content: center; font-size: 12px; background-size: cover; background-position: center;}
        .tpl-lyrics-bg .footer { display: flex; justify-content: space-between; align-items: flex-end; z-index: 2; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 20px; margin-top: auto;}
        .tpl-lyrics-bg .footer-tracks { font-size: 11px; text-transform: uppercase; width: 60%; line-height: 1.6;}
        .tpl-lyrics-bg .palette { display: flex; gap: 8px; align-items: center; font-size: 10px; }
        .tpl-lyrics-bg .dot { width: 15px; height: 15px; border-radius: 50%; }

        /* =========================================
           TEMPLATE 6: Neon Cyan Dark
           ========================================= */
        .tpl-neon { background-color: #0b0b0b; color: #fff; padding: 30px; height: 100%; display: flex; flex-direction: column; font-family: monospace;}
        .tpl-neon .artwork-frame { flex-grow: 1; border: 2px solid #00ffff; background: #15151a; margin-bottom: 20px; display: flex; align-items: center; justify-content: center; color: #00ffff; font-size: 14px; text-transform: uppercase; background-size: cover; background-position: center; }
        .tpl-neon h1 { font-family: impact, sans-serif; font-size: 54px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: -5px; }
        .tpl-neon h2 { color: #00ffff; font-size: 20px; text-transform: uppercase; margin-bottom: 25px; }
        .tpl-neon .tracks { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 12px; color: #aaa; margin-bottom: 30px; }
        .tpl-neon .bottom-bar { display: flex; justify-content: space-between; align-items: flex-end; }
        .tpl-neon .advisory-box { background: #fff; color: #000; padding: 8px 12px; font-weight: bold; font-family: sans-serif; font-size: 10px; text-align: center; }
        .tpl-neon .barcode-box { border: 1px solid #333; padding: 15px 30px; color: #333; font-size: 10px; }

        /* =========================================
           TEMPLATE 7: Vintage Vinyl Sleeve
           ========================================= */
        .tpl-vintage { background-color: #e8e3d3; color: #3b3631; padding: 20px; height: 100%; display: flex; flex-direction: column; font-family: 'Times New Roman', Times, serif; }
        .tpl-vintage .sleeve-border { border: 1px solid #3b3631; padding: 4px; height: 100%; }
        .tpl-vintage .sleeve-inner { border: 2px solid #3b3631; height: 100%; padding: 30px; text-align: center; display: flex; flex-direction: column; }
        .tpl-vintage h1 { font-size: 38px; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px; }
        .tpl-vintage .subtitle { font-style: italic; font-size: 16px; margin-bottom: 30px; }
        .tpl-vintage .art-placeholder { background: #dcd7c6; border: 1px solid #3b3631; flex-grow: 1; margin-bottom: 30px; display: flex; align-items: center; justify-content: center; color: #888; font-family: sans-serif; font-size: 12px; background-size: cover; background-position: center;}
        .tpl-vintage .track-listing { font-size: 14px; margin-bottom: 40px; line-height: 1.8; }
        .tpl-vintage .signatures { display: flex; justify-content: space-between; font-size: 10px; text-transform: uppercase; margin-bottom: 20px; }
        .tpl-vintage .sig-line { border-top: 1px solid #3b3631; width: 40%; padding-top: 5px; }

        /* =========================================
           TEMPLATE 8: Clean Split
           ========================================= */
        .tpl-clean { background-color: #f4f4f4; color: #111; padding: 40px; height: 100%; display: flex; flex-direction: column; }
        .tpl-clean .header { margin-bottom: 20px; }
        .tpl-clean h1 { font-size: 36px; text-transform: uppercase; margin-bottom: 5px; font-weight: 800;}
        .tpl-clean p.sub { font-size: 14px; color: #666; text-transform: uppercase; letter-spacing: 1px; }
        .tpl-clean .big-art { flex-grow: 1; background: #ddd; margin-bottom: 30px; display: flex; align-items: center; justify-content: center; color: #999; font-size: 14px; letter-spacing: 1px; background-size: cover; background-position: center;}
        .tpl-clean .bottom-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; font-size: 11px; margin-bottom: 20px; border-bottom: 1px solid #ddd; padding-bottom: 20px;}
        .tpl-clean .col h3 { font-size: 12px; font-weight: 800; margin-bottom: 12px; }
        .tpl-clean .col ul { list-style: none; line-height: 1.8; color: #444; }
        .tpl-clean .palette-circles { display: flex; gap: 5px; margin-bottom: 15px; }
        .tpl-clean .palette-circles div { width: 18px; height: 18px; border-radius: 50%; background: #999; }
        .tpl-clean .spotify-btn { background: #000; color: #fff; padding: 8px; text-align: center; border-radius: 4px; }
        .tpl-clean .footer-credits { font-size: 9px; color: #888; text-transform: uppercase; }

        /* =========================================
           TEMPLATE 9: Dark Split
           ========================================= */
        .tpl-dark-split { display: flex; height: 100%; background: #111; color: #fff; }
        .tpl-dark-split .left-art { width: 55%; background: #222; display: flex; align-items: center; justify-content: center; color: #555; font-size: 14px; letter-spacing: 2px; background-size: cover; background-position: center;}
        .tpl-dark-split .right-content { width: 45%; padding: 40px 30px; display: flex; flex-direction: column; }
        .tpl-dark-split .tag { color: #ff5500; font-size: 10px; font-weight: bold; letter-spacing: 2px; margin-bottom: 15px; }
        .tpl-dark-split h1 { font-size: 42px; text-transform: uppercase; line-height: 1; margin-bottom: 5px; }
        .tpl-dark-split h2 { font-size: 18px; color: #888; margin-bottom: 30px; font-weight: normal; }
        .tpl-dark-split .track-list { flex-grow: 1; border-top: 1px solid #333; padding-top: 20px; }
        .tpl-dark-split .track-item { display: flex; gap: 15px; margin-bottom: 15px; font-size: 12px; }
        .tpl-dark-split .track-item .num { color: #ff5500; font-weight: bold; }
        .tpl-dark-split .colors { margin-top: auto; margin-bottom: 30px; }
        .tpl-dark-split .colors h3 { font-size: 10px; margin-bottom: 10px; letter-spacing: 1px; }
        .tpl-dark-split .color-blocks { display: flex; gap: 5px; }
        .tpl-dark-split .c-block { width: 25px; height: 25px; background: #fff; }
        .tpl-dark-split .code-box { background: #1a1a1a; padding: 15px; text-align: center; font-size: 10px; color: #555; border-radius: 4px; }

        /* =========================================
           TEMPLATE 10: Yellow Brutalism
           ========================================= */
        .tpl-brutalist { background-color: #fce655; color: #000; padding: 15px; height: 100%; border: 8px solid #000; display: flex; flex-direction: column; font-weight: bold; font-family: sans-serif;}
        .tpl-brutalist .header-box { border-bottom: 4px solid #000; padding-bottom: 10px; margin-bottom: 15px; }
        .tpl-brutalist .header-box h1 { font-size: 46px; text-transform: uppercase; line-height: 1; margin-bottom: 5px; }
        .tpl-brutalist .header-box h2 { font-size: 24px; text-transform: uppercase; }
        .tpl-brutalist .main-grid { display: grid; grid-template-columns: 2.5fr 1fr; gap: 15px; flex-grow: 1; }
        .tpl-brutalist .left-col { display: flex; flex-direction: column; gap: 15px; }
        .tpl-brutalist .art-box { background: #fff; border: 4px solid #000; flex-grow: 1; display: flex; align-items: center; justify-content: center; font-size: 16px; background-size: cover; background-position: center;}
        .tpl-brutalist .tracklist-box { border: 4px solid #000; padding: 15px; background: transparent; }
        .tpl-brutalist .tracklist-box h3 { margin-bottom: 15px; font-size: 14px; }
        .tpl-brutalist .tracklist-box ul { list-style: none; font-size: 12px; line-height: 2; }
        .tpl-brutalist .barcode-brut { border: 4px solid #000; background: #fff; padding: 20px; text-align: center; font-size: 10px; margin-top: auto;}
        .tpl-brutalist .specs-col { border-left: 4px solid #000; padding-left: 15px; display: flex; flex-direction: column;}
        .tpl-brutalist .specs-col h3 { font-size: 12px; margin-bottom: 20px; }
        .tpl-brutalist .specs-col p { font-size: 10px; margin-bottom: 15px; text-transform: uppercase; font-family: monospace; }
        .tpl-brutalist .stamp { width: 100%; aspect-ratio: 1; background: #000; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 10px; margin-top: 30px; }

    </style>
</head>
<body>

    <div id="app-container">
        
        <!-- LEFT: Template Selection -->
        <aside id="template-selector">
            <div class="sidebar-header">TEMPLATES (10)</div>
            <div id="template-list"></div>
        </aside>

        <!-- CENTER: Live Preview -->
        <main id="preview-area">
            <div id="art-board">
                <!-- Content injected via JS -->
            </div>
        </main>

        <!-- RIGHT: The Core Editing Sidebar -->
        <aside id="editor-sidebar">
            <div class="sidebar-header">EDIT PROPERTIES</div>
            
            <div class="control-group">
                <label>Artwork Image URL</label>
                <input type="text" id="edit-artwork" placeholder="https://example.com/image.jpg" oninput="updateState('artwork', this.value)">
            </div>

            <div class="control-group">
                <label>Artist Name</label>
                <input type="text" id="edit-artist" oninput="updateState('artist', this.value)">
            </div>
            
            <div class="control-group">
                <label>Album / Project Title</label>
                <input type="text" id="edit-album" oninput="updateState('album', this.value)">
            </div>

            <div class="control-group">
                <label>Concept / Notes (For Storyboard)</label>
                <textarea id="edit-concept" oninput="updateState('concept', this.value)"></textarea>
            </div>

            <div class="control-group">
                <label>Tracklist / Lyrics</label>
                <div id="track-inputs"></div>
                <button class="btn-add" onclick="addTrack()">+ Add Line</button>
            </div>
        </aside>

    </div>

    <script>
        // --- STATE MANAGEMENT ---
        const state = {
            activeTemplate: 'grid-poster',
            artist: "Artist Name",
            album: "Album Title",
            artwork: "",
            concept: "CONCEPT: Rapid-fire visual transition. The transition structure applies to every individual line of the song.",
            tracks: [
                "Track One",
                "Track Two",
                "Track Three",
                "Track Four",
                "Track Five",
                "Track Six"
            ]
        };

        // --- TEMPLATE DEFINITIONS (ALL 10) ---
        const templates = {
            'grid-poster': {
                name: "1. Grid Poster",
                render: (s) => {
                    const count = s.tracks.length;
                    
                    // Stay at full standard size until track count gets high enough to approach the bottom
                    let fs = 12;
                    let lh = 1.35;
                    let mb = 5;
                    if (count > 9) {
                        fs = 10;
                        lh = 1.15;
                        mb = 2;
                    }

                    return `
                        <div class="tpl-grid-poster">
                            <div class="titles">
                                <h2>${s.artist}</h2>
                                <h1>${s.album}</h1>
                            </div>
                            <div class="hero-artwork" style="${s.artwork ? `background-image: url('${s.artwork}'); background-size: contain; background-repeat: no-repeat; background-position: center; background-color: #121212;` : ''}">
                                ${s.artwork ? '' : 'ALBUM ARTWORK (SQUARE)'}
                            </div>
                            <div class="tracklist-section">
                                <div class="tracklist-header">— TRACKLIST (${count}) —</div>
                                <div class="tracklist" style="font-size: ${fs}px; line-height: ${lh};">
                                    ${s.tracks.map((t, i) => `<div class="tracklist-item" style="margin-bottom: ${mb}px;">0${i+1}. ${t.toUpperCase()}</div>`).join('')}
                                </div>
                            </div>
                        </div>
                    `;
                }
            },
            'directors-cut': {
                name: "2. Director's Cut",
                render: (s) => `
                    <div class="tpl-directors-cut">
                        <div class="header">
                            <h1>${s.album}</h1>
                            <h2>DIRECTOR's CUT VISUAL TREATMENT</h2>
                        </div>
                        <div class="concept">${s.concept}</div>
                        <div class="scene-grid">
                            ${s.tracks.slice(0, 5).map((track, i) => `
                                <div class="scene-row">
                                    <div class="scene-text">
                                        <div class="scene-meta">SCENE 0${i+1} - 0:0${i*3}</div>
                                        <div class="scene-lyric">"${track}"</div>
                                    </div>
                                    <div class="scene-art" style="${s.artwork ? `background-image: url('${s.artwork}');` : ''}">
                                        ${s.artwork ? '' : 'SCENE ART'}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                        <div class="footer">
                            ARTIST: ${s.artist} | TRACKLIST: ${s.tracks.map((t,i)=>`0${i+1}. ${t}`).join(', ')}<br>
                            SPOTIFY CODE: ||| | || || | || |
                        </div>
                    </div>
                `
            },
            'vinyl-center': {
                name: "3. Vinyl Center",
                render: (s) => `
                    <div class="tpl-vinyl-center">

        // --- CORE LOGIC ---

        function initApp() {
            const selector = document.getElementById('template-list');
            for (const [key, tpl] of Object.entries(templates)) {
                const btn = document.createElement('button');
                btn.className = `template-btn ${key === state.activeTemplate ? 'active' : ''}`;
                btn.innerText = tpl.name;
                btn.onclick = (e) => selectTemplate(key, e);
                selector.appendChild(btn);
            }

            // Sync initial state to sidebar inputs
            document.getElementById('edit-artwork').value = state.artwork;
            document.getElementById('edit-artist').value = state.artist;
            document.getElementById('edit-album').value = state.album;
            document.getElementById('edit-concept').value = state.concept;
            
            renderTrackInputs();
            renderPreview();
        }

        function selectTemplate(templateKey, event) {
            state.activeTemplate = templateKey;
            document.querySelectorAll('.template-btn').forEach(btn => btn.classList.remove('active'));
            if(event) event.target.classList.add('active');
            renderPreview();
        }

        function updateState(key, value) {
            state[key] = value;
            renderPreview();
        }

        function updateTrack(index, value) {
            state.tracks[index] = value;
            renderPreview();
        }

        function addTrack() {
            if (state.tracks.length >= 14) return; // Cap at 14 tracks max
            state.tracks.push(`Track ${state.tracks.length + 1}`);
            renderTrackInputs();
            renderPreview();
        }

        function removeTrack(index) {
            state.tracks.splice(index, 1);
            renderTrackInputs();
            renderPreview();
        }

        function renderTrackInputs() {
            const container = document.getElementById('track-inputs');
            container.innerHTML = '';
            
            state.tracks.forEach((track, index) => {
                const div = document.createElement('div');
                div.className = 'track-input-group';
                
                const input = document.createElement('input');
                input.type = 'text';
                input.value = track;
                input.oninput = (e) => updateTrack(index, e.target.value);
                
                const delBtn = document.createElement('button');
                delBtn.innerText = 'X';
                delBtn.style.padding = '0 10px';
                delBtn.style.background = '#442222';
                delBtn.style.color = 'white';
                delBtn.style.border = 'none';
                delBtn.style.cursor = 'pointer';
                delBtn.onclick = () => removeTrack(index);
                
                div.appendChild(input);
                div.appendChild(delBtn);
                container.appendChild(div);
            });
        }

        function renderPreview() {
            const board = document.getElementById('art-board');
            const template = templates[state.activeTemplate];
            if (template) {
                board.innerHTML = template.render(state);
            }
        }

        window.onload = initApp;

    </script>
</body>
