<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Album Poster Generator (A2 Scale)</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; height: 100vh; background: #222; color: #fff; }
        #sidebar { width: 380px; background: #181818; padding: 20px; overflow-y: auto; border-right: 1px solid #333; flex-shrink: 0; }
        #sidebar h2 { margin-top: 0; font-size: 1.1rem; border-bottom: 1px solid #333; padding-bottom: 10px; color: #00ffcc; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 0.8rem; margin-bottom: 5px; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }
        .input-group input, .input-group select, .input-group textarea { width: 100%; padding: 10px; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 4px; font-family: inherit; }
        .input-group textarea { resize: vertical; min-height: 120px; }
        .input-group input:focus, .input-group select:focus, .input-group textarea:focus { outline: none; border-color: #00ffcc; }
        .file-input { padding: 5px !important; margin-top: 5px; font-size: 0.8rem; }
        #downloadBtn { width: 100%; padding: 12px; background: #00ffcc; color: #000; border: none; font-weight: bold; border-radius: 4px; cursor: pointer; margin-top: 10px; text-transform: uppercase; letter-spacing: 1px; }
        #downloadBtn:hover { background: #00cca3; }
        #preview-container { flex-grow: 1; display: flex; justify-content: center; align-items: center; padding: 30px; overflow: hidden; background: #111; }
        #canvas-wrapper { width: 1190px; height: 1684px; background: #fff; box-shadow: 0 10px 30px rgba(0,0,0,0.8); flex-shrink: 0; position: relative; overflow: hidden; transform-origin: center center; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>
    <div id="sidebar">
        <h2>Poster Generator</h2>
        
        <div class="input-group">
            <label for="templateSelect">Select Template</label>
            <select id="templateSelect">
                <option value="1">Template 1: Swiss / Minimalist (Left Aligned)</option>
                <option value="2">Template 2: Y2K / Cyber Streetwear</option>
                <option value="3">Template 3: Vintage Vinyl Frame</option>
                <option value="4">Template 4: Editorial / Magazine Style</option>
                <option value="5">Template 5: Neo-Brutalist Grid</option>
                <option value="6">Template 6: MPC Sampler / Classic Hip-Hop</option>
                <option value="7">Template 7: Director's Cut Storyboard</option>
                <option value="8">Template 8: Chicago Soul / Vinyl Sleeve</option>
                <option value="9">Template 9: Modern Brutalist / Experimental</option>
                <option value="10">Template 10: Lyrical Typography Focus</option>
            </select>
        </div>

        <div class="input-group">
            <label for="artistName">Artist Name</label>
            <input type="text" id="artistName" value="ARTIST NAME">
        </div>

        <div class="input-group">
            <label for="albumTitle">Album Title</label>
            <input type="text" id="albumTitle" value="ALBUM TITLE">
        </div>

        <div class="input-group">
            <label for="producerName">Producer / Label</label>
            <input type="text" id="producerName" value="PRODUCER">
        </div>

        <div class="input-group">
            <label for="releaseYear">Release Year</label>
            <input type="text" id="releaseYear" value="2026">
        </div>

        <div class="input-group">
            <label for="catalogNo">Catalog Number</label>
            <input type="text" id="catalogNo" value="CAT-001">
        </div>

        <div class="input-group">
            <label for="artworkUrl">Album Artwork (URL or Upload)</label>
            <input type="text" id="artworkUrl" placeholder="https://example.com/image.jpg">
            <input type="file" id="artworkFile" accept="image/*" class="file-input">
        </div>

        <div class="input-group">
            <label for="spotifyCodeUrl">Spotify Code Image (URL or Upload)</label>
            <input type="text" id="spotifyCodeUrl" placeholder="https://example.com/spotify_code.png">
            <input type="file" id="spotifyCodeFile" accept="image/*" class="file-input">
        </div>

        <div class="input-group">
            <label for="tracklist">Tracklist (Type SIDE A, SIDE B, SIDE C, etc.)</label>
            <textarea id="tracklist">SIDE A
Track One Title
Track Two Title
Track Three Title
SIDE B
Track Four Title
Track Five Title
Track Six Title
SIDE C
Track Seven Title
Track Eight Title
SIDE D
Track Nine Title
Track Ten Title</textarea>
        </div>

        <button id="downloadBtn">Download A2 Poster</button>
    </div>

    <div id="preview-container">
        <div id="canvas-wrapper"></div>
    </div>

    <script>
        let uploadedArtworkUrl = '';
        let uploadedSpotifyCodeUrl = '';

        const templates = {
            1: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 1684" width="100%" height="100%">
              <rect width="1190" height="1684" fill="#F4F4F0"/>
              
              <!-- Left-Aligned Header -->
              <text x="80" y="95" font-family="Helvetica, Arial, sans-serif" font-size="52" font-weight="bold" fill="#111111">{{ALBUM_TITLE}}</text>
              <text x="80" y="140" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#666666">{{ARTIST_NAME}} • {{RELEASE_YEAR}}</text>
              
              <!-- Slightly Smaller Centered Square Album Cover -->
              <rect x="120" y="175" width="950" height="950" fill="#E0E0E0" stroke="#CCCCCC" stroke-width="2"/>
              <image x="120" y="175" width="950" height="950" href="{{ARTWORK_URL}}" preserveAspectRatio="xMidYMid slice" />
              
              <!-- Dynamic Stacked Tracklist Grid (Bigger Text, Auto-scaled) -->
              {{DYNAMIC_SIDES}}

              <!-- Dominant Palette Circles (No Text Label, Excludes White) -->
              <g transform="translate(80, 1480)">
                <circle cx="14" cy="14" r="14" fill="{{PALETTE_1}}"/>
                <circle cx="54" cy="14" r="14" fill="{{PALETTE_2}}"/>
                <circle cx="94" cy="14" r="14" fill="{{PALETTE_3}}"/>
                <circle cx="134" cy="14" r="14" fill="{{PALETTE_4}}"/>
              </g>
              
              <!-- Uploaded Spotify Code Image (No Text Label) -->
              <g transform="translate(830, 1466)">
                <rect width="280" height="60" fill="#EAEAEA" rx="6"/>
                <image width="280" height="60" href="{{SPOTIFY_CODE_URL}}" preserveAspectRatio="xMidYMid contain" />
              </g>

              <line x1="80" y1="1560" x2="1110" y2="1560" stroke="#CCCCCC" stroke-width="2"/>
              <text x="80" y="1605" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#888888">PRODUCED BY {{PRODUCER}} • CATALOG NO. {{CATALOG_NO}}</text>
            </svg>`,

            2: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 1684" width="100%" height="100%">
              <rect width="1190" height="1684" fill="#0A0A0C"/>
              <rect x="100" y="100" width="990" height="800" fill="#1A1A24" stroke="#00FFCC" stroke-width="4"/>
              <image x="100" y="100" width="990" height="800" href="{{ARTWORK_URL}}" preserveAspectRatio="xMidYMid slice" />
              <text x="100" y="980" font-family="'Impact', sans-serif" font-size="72" fill="#FFFFFF" letter-spacing="4">{{ARTIST_NAME}}</text>
              <text x="100" y="1050" font-family="'Courier New', monospace" font-size="36" fill="#00FFCC">{{ALBUM_TITLE}}</text>
              <text x="100" y="1130" font-family="'Courier New', monospace" font-size="20" fill="#888888">TRACKLIST</text>
              {{TRACKLIST_SVG_GRID_2}}
              <rect x="100" y="1500" width="180" height="100" fill="#FFFFFF"/>
              <text x="190" y="1544" font-family="Impact, sans-serif" font-size="20" fill="#000000" text-anchor="middle">PARENTAL</text>
              <text x="190" y="1570" font-family="Impact, sans-serif" font-size="20" fill="#000000" text-anchor="middle">ADVISORY</text>
              <text x="190" y="1588" font-family="Arial, sans-serif" font-size="10" fill="#000000" text-anchor="middle">EXPLICIT CONTENT</text>
              <image x="850" y="1500" width="240" height="100" href="{{SPOTIFY_CODE_URL}}" preserveAspectRatio="xMidYMid contain" />
            </svg>`
        };

        // Extract palette excluding white and near-white pixels
        function extractPaletteFromImage(imgUrl, callback) {
            const defaultPalette = ['#2b2b2b', '#555555', '#888888', '#aaaaaa'];
            if (!imgUrl) {
                callback(defaultPalette);
                return;
            }
            const img = new Image();
            img.crossOrigin = "Anonymous";
            img.src = imgUrl;
            img.onload = function() {
                try {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = 50;
                    canvas.height = 50;
                    ctx.drawImage(img, 0, 0, 50, 50);
                    const imgData = ctx.getImageData(0, 0, 50, 50).data;
                    
                    let colors = [];
                    for (let i = 0; i < imgData.length; i += 16) {
                        let r = imgData[i];
                        let g = imgData[i+1];
                        let b = imgData[i+2];
                        let a = imgData[i+3];
                        
                        if (a < 128) continue;
                        if (r > 215 && g > 215 && b > 215) continue; // Exclude white
                        
                        colors.push({ r, g, b });
                    }
                    
                    if (colors.length < 4) {
                        callback(defaultPalette);
                        return;
                    }

                    let step = Math.floor(colors.length / 4);
                    let p1 = `rgb(${colors[0].r}, ${colors[0].g}, ${colors[0].b})`;
                    let p2 = `rgb(${colors[step].r}, ${colors[step].g}, ${colors[step].b})`;
                    let p3 = `rgb(${colors[step * 2].r}, ${colors[step * 2].g}, ${colors[step * 2].b})`;
                    let p4 = `rgb(${colors[step * 3].r}, ${colors[step * 3].g}, ${colors[step * 3].b})`;

                    callback([p1, p2, p3, p4]);
                } catch(e) {
                    callback(defaultPalette);
                }
            };
            img.onerror = function() {
                callback(defaultPalette);
            };
        }

        function updatePoster() {
            const templateId = document.getElementById('templateSelect').value;
            const artist = document.getElementById('artistName').value;
            const title = document.getElementById('albumTitle').value;
            const producer = document.getElementById('producerName').value;
            const year = document.getElementById('releaseYear').value;
            const catalogNo = document.getElementById('catalogNo').value;
            
            const artworkUrl = uploadedArtworkUrl || document.getElementById('artworkUrl').value;
            const spotifyCodeUrl = uploadedSpotifyCodeUrl || document.getElementById('spotifyCodeUrl').value;
            
            const rawTrackText = document.getElementById('tracklist').value;
            const lines = rawTrackText.split('\n');

            extractPaletteFromImage(artworkUrl, (palette) => {
                let code = templates[templateId] || templates[1];

                // Parse Multi-Sides for Stacked Row Grid (Side C underneath Side A)
                let sides = [];
                let currentSide = { title: "SIDE A", tracks: [] };
                lines.forEach(line => {
                    let trimmed = line.trim();
                    if (!trimmed) return;
                    if (trimmed.toUpperCase().startsWith("SIDE") || trimmed.toUpperCase().startsWith("VOL") || trimmed.toUpperCase().startsWith("PART")) {
                        if (currentSide.tracks.length > 0 || currentSide.title !== "SIDE A") {
                            sides.push(currentSide);
                        }
                        currentSide = { title: trimmed.toUpperCase(), tracks: [] };
                    } else {
                        currentSide.tracks.push(trimmed);
                    }
                });
                sides.push(currentSide);

                // Dynamic sizing with bigger base font sizes and auto-scaling
                let numRows = Math.ceil(sides.length / 2);
                let maxTracks = Math.max(...sides.map(s => s.tracks.length), 1);
                
                let fontSize = 19;
                let lineGap = 26;
                let rowGap = 26;
                
                if (numRows >= 2 || maxTracks > 6) {
                    fontSize = 15;
                    lineGap = 21;
                    rowGap = 21;
                }
                if (numRows >= 3 || maxTracks > 9) {
                    fontSize = 13;
                    lineGap = 18;
                    rowGap = 18;
                }
                if (numRows >= 4 || maxTracks > 12) {
                    fontSize = 11;
                    lineGap = 15;
                    rowGap = 15;
                }

                let dynamicSidesSvg = '';
                let col0X = 80;   // Left column X matching left alignment
                let col1X = 630;  // Right column X
                let currentY = 1175; // Directly beneath smaller album cover (175 + 950 = 1125)

                for (let i = 0; i < sides.length; i += 2) {
                    let sideLeft = sides[i];
                    let sideRight = sides[i + 1];

                    if (sideLeft) {
                        dynamicSidesSvg += `<text x="${col0X}" y="${currentY}" font-family="Helvetica, Arial, sans-serif" font-size="${fontSize + 2}" font-weight="bold" fill="#111111">${sideLeft.title}</text>\n`;
                        sideLeft.tracks.forEach((track, tIdx) => {
                            let tNum = (tIdx + 1).toString().padStart(2, '0');
                            let tY = currentY + lineGap + (tIdx * lineGap);
                            dynamicSidesSvg += `<text x="${col0X}" y="${tY}" font-family="Helvetica, Arial, sans-serif" font-size="${fontSize}" fill="#444444">${tNum}. ${track}</text>\n`;
                        });
                    }

                    if (sideRight) {
                        dynamicSidesSvg += `<text x="${col1X}" y="${currentY}" font-family="Helvetica, Arial, sans-serif" font-size="${fontSize + 2}" font-weight="bold" fill="#111111">${sideRight.title}</text>\n`;
                        sideRight.tracks.forEach((track, tIdx) => {
                            let tNum = (tIdx + 1).toString().padStart(2, '0');
                            let tY = currentY + lineGap + (tIdx * lineGap);
                            dynamicSidesSvg += `<text x="${col1X}" y="${tY}" font-family="Helvetica, Arial, sans-serif" font-size="${fontSize}" fill="#444444">${tNum}. ${track}</text>\n`;
                        });
                    }

                    let maxT = Math.max(
                        sideLeft ? sideLeft.tracks.length : 0,
                        sideRight ? sideRight.tracks.length : 0
                    );
                    currentY += lineGap + (maxT * lineGap) + rowGap;
                }

                let allTracks = [];
                lines.forEach(l => {
                    let t = l.trim();
                    if (t && !t.toUpperCase().startsWith("SIDE") && !t.toUpperCase().startsWith("VOL")) {
                        allTracks.push(t);
                    }
                });

                let svgGrid2 = '';
                allTracks.forEach((t, i) => {
                    let num = (i + 1).toString().padStart(2, '0');
                    if (i < 8) {
                        let x = i < 4 ? 100 : 600;
                        let y = 1180 + ((i % 4) * 44);
                        svgGrid2 += `<text x="${x}" y="${y}" font-family="'Courier New', monospace" font-size="20" fill="#FFFFFF">${num}. ${t}</text>\n`;
                    }
                });

                code = code
                    .replace(/{{ARTIST_NAME}}/g, artist)
                    .replace(/{{ALBUM_TITLE}}/g, title)
                    .replace(/{{PRODUCER}}/g, producer)
                    .replace(/{{RELEASE_YEAR}}/g, year)
                    .replace(/{{CATALOG_NO}}/g, catalogNo)
                    .replace(/{{ARTWORK_URL}}/g, artworkUrl)
                    .replace(/{{SPOTIFY_CODE_URL}}/g, spotifyCodeUrl)
                    .replace(/{{DYNAMIC_SIDES}}/g, dynamicSidesSvg)
                    .replace(/{{PALETTE_1}}/g, palette[0])
                    .replace(/{{PALETTE_2}}/g, palette[1])
                    .replace(/{{PALETTE_3}}/g, palette[2])
                    .replace(/{{PALETTE_4}}/g, palette[3])
                    .replace(/{{TRACKLIST_SVG_GRID_2}}/g, svgGrid2);

                const wrapper = document.getElementById('canvas-wrapper');
                if (code.includes('<svg')) {
                    wrapper.innerHTML = code;
                } else {
                    wrapper.innerHTML = '<iframe></iframe>';
                    const iframe = wrapper.querySelector('iframe');
                    iframe.contentWindow.document.open();
                    iframe.contentWindow.document.write(code);
                    iframe.contentWindow.document.close();
                }
            });
        }

        document.getElementById('artworkFile').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (evt) => {
                    uploadedArtworkUrl = evt.target.result;
                    document.getElementById('artworkUrl').value = '';
                    updatePoster();
                };
                reader.readAsDataURL(file);
            }
        });

        document.getElementById('spotifyCodeFile').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (evt) => {
                    uploadedSpotifyCodeUrl = evt.target.result;
                    document.getElementById('spotifyCodeUrl').value = '';
                    updatePoster();
                };
                reader.readAsDataURL(file);
            }
        });

        document.getElementById('downloadBtn').addEventListener('click', () => {
            const wrapper = document.getElementById('canvas-wrapper');
            let filename = document.getElementById('albumTitle').value.toLowerCase().replace(/[^a-z0-9]/g, '_') + '_a2_poster';
            
            if (wrapper.querySelector('svg')) {
                const svgData = wrapper.innerHTML;
                const blob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename + '.svg';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            }
        });

        document.querySelectorAll('#sidebar input, #sidebar textarea, #sidebar select').forEach(el => {
            el.addEventListener('input', () => {
                if (el.id === 'artworkUrl') uploadedArtworkUrl = '';
                if (el.id === 'spotifyCodeUrl') uploadedSpotifyCodeUrl = '';
                updatePoster();
            });
            el.addEventListener('change', updatePoster);
        });

        function adjustPreviewScale() {
            const container = document.getElementById('preview-container');
            const wrapper = document.getElementById('canvas-wrapper');
            const scale = Math.min((container.clientWidth - 60) / 1190, (container.clientHeight - 60) / 1684, 1);
            wrapper.style.transform = `scale(${scale})`;
        }

        window.addEventListener('resize', adjustPreviewScale);
        window.onload = () => {
            updatePoster();
            adjustPreviewScale();
        };
    </script>
</body>
</html>
