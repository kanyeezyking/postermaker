<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Album Poster Editor</title>
<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}

header {
    padding: 20px;
    background: #181818;
    border-bottom: 1px solid #333;
}

h1 {
    margin: 0;
}

.container {
    display: flex;
    height: calc(100vh - 80px);
}

.sidebar {
    width: 320px;
    background: #161616;
    padding: 20px;
    overflow-y: auto;
    border-right: 1px solid #333;
}

.editor {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #222;
}

.canvas-wrapper {
    background: white;
    width: 600px;
    height: 600px;
    position: relative;
    overflow: hidden;
}

.poster-element {
    position: absolute;
    cursor: move;
    user-select: none;
}

button {
    width: 100%;
    padding: 12px;
    margin: 5px 0;
    background: #333;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

button:hover {
    background:#555;
}

input {
    width:100%;
    padding:10px;
    margin:5px 0;
    background:#222;
    border:1px solid #555;
    color:white;
}

.template {
    background:#222;
    padding:10px;
    margin:10px 0;
    border-radius:8px;
    cursor:pointer;
}

.template:hover {
    background:#333;
}

.control-group {
    margin-bottom:20px;
}

label {
    display:block;
    margin-bottom:5px;
}
</style>
</head>

<body>

<header>
<h1>Album Poster Editor</h1>
</header>


<div class="container">

<div class="sidebar">

<h2>Templates</h2>

<div class="template" onclick="loadTemplate(1)">
Template 1 - Tracklist Poster
</div>

<div class="template" onclick="loadTemplate(2)">
Template 2 - Minimal Album
</div>

<div class="template" onclick="loadTemplate(3)">
Template 3 - Artist Focus
</div>

<div class="template" onclick="loadTemplate(4)">
Template 4 - Classic Cover
</div>

<div class="template" onclick="loadTemplate(5)">
Template 5 - Tour Poster
</div>


<hr>


<h2>Edit Selected</h2>

<div class="control-group">

<label>Text</label>
<input id="textInput" placeholder="Change text">

<button onclick="updateText()">Update Text</button>

</div>


<div class="control-group">

<label>Upload Image</label>
<input type="file" id="imageInput">

</div>


<button onclick="addText()">
Add Text
</button>

<button onclick="savePoster()">
Save Poster
</button>


<button onclick="clearPoster()">
Clear
</button>


</div>


<div class="editor">

<div id="canvas" class="canvas-wrapper">

</div>

</div>

</div>


<script>

let selectedElement = null;


function createElement(type, content, x, y){

let el=document.createElement("div");

el.className="poster-element";

el.style.left=x+"px";
el.style.top=y+"px";


if(type==="text"){
    el.innerText=content;
    el.style.fontSize="32px";
    el.style.color="black";
    el.style.fontWeight="bold";
}


if(type==="image"){
    let img=document.createElement("img");
    img.src=content;
    img.style.width="200px";
    el.appendChild(img);
}


el.onclick=function(e){
    e.stopPropagation();
    selectedElement=el;
};


dragElement(el);


document.getElementById("canvas").appendChild(el);

return el;

}



function dragElement(el){

let offsetX;
let offsetY;
let dragging=false;


el.onmousedown=function(e){

dragging=true;

offsetX=e.offsetX;
offsetY=e.offsetY;

};


document.onmousemove=function(e){

if(!dragging)return;


let rect=document.getElementById("canvas").getBoundingClientRect();

el.style.left=(e.clientX-rect.left-offsetX)+"px";
el.style.top=(e.clientY-rect.top-offsetY)+"px";

};


document.onmouseup=function(){

dragging=false;

};

}



function addText(){

createElement(
"text",
"NEW TEXT",
100,
100
);

}



function updateText(){

if(!selectedElement)return;

selectedElement.innerText=
document.getElementById("textInput").value;

}



document.getElementById("imageInput").onchange=function(e){

let file=e.target.files[0];

if(!file)return;


let reader=new FileReader();

reader.onload=function(){

createElement(
"image",
reader.result,
200,
200
);

}

reader.readAsDataURL(file);

}



function clearPoster(){

document.getElementById("canvas").innerHTML="";

}



function savePoster(){

localStorage.setItem(
"poster",
document.getElementById("canvas").innerHTML
);

alert("Saved");

}



function loadSaved(){

let saved=localStorage.getItem("poster");

if(saved){

document.getElementById("canvas").innerHTML=saved;

}

}



function loadTemplate(id){

clearPoster();


if(id===1){

createElement(
"text",
"ALBUM TITLE",
150,
50
);

createElement(
"text",
"01\n02\n03\n04\n05",
100,
400
);

}



if(id===2){

createElement(
"text",
"ARTIST",
250,
100
);

createElement(
"text",
"ALBUM NAME",
200,
250
);

}



if(id===3){

createElement(
"text",
"ARTIST NAME",
150,
150
);

}



if(id===4){

createElement(
"text",
"CLASSIC ALBUM",
150,
300
);

}



if(id===5){

createElement(
"text",
"WORLD TOUR",
200,
100
);

}

}



loadSaved();

</script>


</body>
</html>
