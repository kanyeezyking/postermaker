        .input-group label { display: block; font-size: 0.8rem; margin-bottom: 5px; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }
        .input-group input, .input-group select, .input-group textarea { width: 100%; padding: 10px; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 4px; font-family: inherit; }

        #downloadBtn { width: 100%; padding: 12px; background: #00ffcc; color: #000; border: none; font-weight: bold; border-radius: 4px; cursor: pointer; margin-top: 10px; text-transform: uppercase; letter-spacing: 1px; }

        #preview-container { flex-grow: 1; display: flex; justify-content: center; align-items: center; padding: 30px; overflow: auto; background: #111; }
        #canvas-wrapper { width: 1190px; height: 1684px; background: #fff; box-shadow: 0 10px 30px rgba(0,0,0,0.8); flex-shrink: 0; position: relative; overflow: hidden; transform-origin: top center; }

    </style>
</head>

        <div class="input-group">

        <div class="input-group">

        </div>

        <div class="input-group">

        </div>

        <div class="input-group">
            <label for="catalogNo">Catalog Number</label>
            <input type="text" id="catalogNo" value="CAT-001">
        </div>

        <div class="input-group">
            <label for="spotifyCode">Spotify Code Text</label>
            <input type="text" id="spotifyCode" value="SPOTIFY CODE">
        </div>

        <div class="input-group">
            <label for="artworkUrl">Artwork Image URL</label>
            <input type="text" id="artworkUrl" placeholder="https://example.com/image.jpg">
        </div>

Track One Title
Track Two Title
Track Three Title
SIDE B
Track Four Title
Track Five Title
Track Six Title</textarea>

        // Automatic image color extractor helper
        function extractPaletteFromImage(imgUrl, callback) {
            if (!imgUrl) {
                callback(['#333333', '#666666', '#999999', '#cccccc']);
                return;
            }
            const img = new Image();
            img.crossOrigin = "Anonymous";
            img.src = imgUrl;
            img.onload = function() {
                try {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = 30;
                    canvas.height = 30;
                    ctx.drawImage(img, 0, 0, 30, 30);
                    const imgData = ctx.getImageData(0, 0, 30, 30).data;
                    
                    let colors = [];
                    for (let i = 0; i < imgData.length; i += 36) {
                        colors.push({
                            r: imgData[i],
                            g: imgData[i+1],
                            b: imgData[i+2]
                        });
                    }
                    let p1 = `rgb(${colors[2]?.r || 40}, ${colors[2]?.g || 40}, ${colors[2]?.b || 40})`;
                    let p2 = `rgb(${colors[8]?.r || 100}, ${colors[8]?.g || 100}, ${colors[8]?.b || 100})`;
                    let p3 = `rgb(${colors[15]?.r || 160}, ${colors[15]?.g || 160}, ${colors[15]?.b || 160})`;
                    let p4 = `rgb(${colors[20]?.r || 220}, ${colors[20]?.g || 220}, ${colors[20]?.b || 220})`;
                    callback([p1, p2, p3, p4]);
                } catch(e) {
                    callback(['#333333', '#666666', '#999999', '#cccccc']);
                }
            };
            img.onerror = function() {
                callback(['#333333', '#666666', '#999999', '#cccccc']);
            };
        }

            const artist = document.getElementById('artistName').value;
            const title = document.getElementById('albumTitle').value;
            const producer = document.getElementById('producerName').value;
            const year = document.getElementById('releaseYear').value;
            const catalogNo = document.getElementById('catalogNo').value;
            const spotifyCode = document.getElementById('spotifyCode').value;
            const artworkUrl = document.getElementById('artworkUrl').value;
            const rawTrackText = document.getElementById('tracklist').value;
            const lines = rawTrackText.split('\n');

            extractPaletteFromImage(artworkUrl, (palette) => {
                let code = templates[templateId];

                // Parse Multi-Sides for Template 1 (A2 Scale coordinates)
                let sides = [];
                let currentSide = { title: "SIDE A", tracks: [] };
                lines.forEach(line => {
                    let trimmed = line.trim();
                    if (!trimmed) return;
                    if (trimmed.toUpperCase().startsWith("SIDE") || trimmed.toUpperCase().startsWith("VOL") || trimmed.toUpperCase().startsWith("PART")) {
                        if (currentSide.tracks.length > 0 || currentSide.title !== "SIDE A") {
                            sides.push(currentSide);
                        }
                        currentSide = { title: trimmed.toUpperCase(), tracks: [] };
                    } else {
                        currentSide.tracks.push(trimmed);
                    }
                });
                sides.push(currentSide);

                let dynamicSidesSvg = '';
                let startX = 80;
                let startY = 1260;
                sides.forEach((side, sIdx) => {
                    if (sIdx > 0 && sIdx % 3 === 0) {
                        startX = 80;
                        startY += 210;
                    } else if (sIdx > 0) {
                        startX += 350;
                    }
                    
                    dynamicSidesSvg += `<text x="${startX}" y="${startY}" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#111111">${side.title}</text>\n`;
                    
                    side.tracks.forEach((track, tIdx) => {
                        let tNum = (tIdx + 1).toString().padStart(2, '0');
                        let tY = startY + 32 + (tIdx * 30);
                        if (tY < 1540) {
                            dynamicSidesSvg += `<text x="${startX}" y="${tY}" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#444444">${tNum}. ${track}</text>\n`;
                        }
                    });
                });

                // Standard track lists for other templates
                let allTracks = [];
                lines.forEach(l => {
                    let t = l.trim();
                    if (t && !t.toUpperCase().startsWith("SIDE") && !t.toUpperCase().startsWith("VOL")) {
                        allTracks.push(t);
                    }
                });

                let svgGrid2 = '';
                let svgCenter = '';
                let svgEditorial = '';
                let svgBrutal = '';
                let htmlList = '';
                let htmlBrutal = '';
                let storyboardFrames = '';
                let inlineTracks = allTracks.join(' • ');

                allTracks.forEach((t, i) => {
                    let num = (i + 1).toString().padStart(2, '0');
                    
                    if(i < 8) {
                        let x = i < 4 ? 100 : 600;
                        let y = 1180 + ((i % 4) * 44);
                        svgGrid2 += `<text x="${x}" y="${y}" font-family="'Courier New', monospace" font-size="20" fill="#FFFFFF">${num}. ${t}</text>\n`;
                    }
                    htmlList += `${num}. ${t} <br>`;
                    htmlBrutal += `<div class="track">${num}. ${t}</div>`;
                    
                    if(i < 8) svgCenter += `<text x="595" y="${950 + (i * 36)}" font-family="'Times New Roman', serif" font-size="20" fill="#2C221E" text-anchor="middle">${i+1}. ${t}</text>\n`;
                    if(i < 8) svgEditorial += `<text x="620" y="${420 + (i * 50)}" font-family="Helvetica, sans-serif" font-size="18" fill="#FF4500">0${i+1}</text><text x="670" y="${420 + (i * 50)}" font-family="Helvetica, sans-serif" font-size="18" fill="#DDDDDD">${t}</text>\n`;
                    if(i < 10) svgBrutal += `<text x="680" y="${390 + (i * 40)}" font-family="Courier, monospace" font-size="18" font-weight="bold" fill="#000000">${num}. ${t}</text>\n`;
                    
                    if(i < 6) {
                        storyboardFrames += `<div class="frame"><div class="frame-number">SCENE 0${i+1}</div><div class="frame-lyric">"${t}"</div><div class="frame-image"></div></div>\n`;
                    }
                });

                code = code
                    .replace(/{{ARTIST_NAME}}/g, artist)
                    .replace(/{{ALBUM_TITLE}}/g, title)
                    .replace(/{{PRODUCER}}/g, producer)
                    .replace(/{{RELEASE_YEAR}}/g, year)
                    .replace(/{{CATALOG_NO}}/g, catalogNo)
                    .replace(/{{SPOTIFY_CODE}}/g, spotifyCode)
                    .replace(/{{ARTWORK_URL}}/g, artworkUrl)
                    .replace(/{{DYNAMIC_SIDES}}/g, dynamicSidesSvg)
                    .replace(/{{PALETTE_1}}/g, palette[0])
                    .replace(/{{PALETTE_2}}/g, palette[1])
                    .replace(/{{PALETTE_3}}/g, palette[2])
                    .replace(/{{PALETTE_4}}/g, palette[3])
                    .replace(/{{TRACKLIST_SVG_GRID_2}}/g, svgGrid2)
                    .replace(/{{TRACKLIST_SVG_CENTER}}/g, svgCenter)
                    .replace(/{{TRACKLIST_SVG_EDITORIAL}}/g, svgEditorial)
                    .replace(/{{TRACKLIST_SVG_BRUTALIST}}/g, svgBrutal)
                    .replace(/{{TRACKLIST_HTML}}/g, htmlList)
                    .replace(/{{TRACKLIST_HTML_BRUTALIST}}/g, htmlBrutal)
                    .replace(/{{TRACKLIST_INLINE}}/g, inlineTracks)
                    .replace(/{{STORYBOARD_FRAMES}}/g, storyboardFrames);

                const wrapper = document.getElementById('canvas-wrapper');
                if (code.includes('<svg')) {
                    wrapper.innerHTML = code;
                } else {
                    wrapper.innerHTML = '<iframe></iframe>';
                    const iframe = wrapper.querySelector('iframe');
                    iframe.contentWindow.document.open();
                    iframe.contentWindow.document.write(code);
                    iframe.contentWindow.document.close();
                }
            });
        }

        document.getElementById('downloadBtn').addEventListener('click', () => {
            const wrapper = document.getElementById('canvas-wrapper');
            let filename = document.getElementById('albumTitle').value.toLowerCase().replace(/[^a-z0-9]/g, '_') + '_a2_poster';
            
            if (wrapper.querySelector('svg')) {
                const svgData = wrapper.innerHTML;
                const blob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename + '.svg';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            } else {
                const iframe = wrapper.querySelector('iframe');
                if (iframe) {
                    const htmlContent = iframe.contentWindow.document.documentElement.outerHTML;
                    const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = filename + '.html';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                }
            }
        });

        document.querySelectorAll('#sidebar input, #sidebar textarea, #sidebar select').forEach(el => {
            el.addEventListener('input', updatePoster);
            el.addEventListener('change', updatePoster);
        });

        // Scale preview down slightly to fit comfortable viewport view while maintaining exact A2 proportions
        function adjustPreviewScale() {
            const container = document.getElementById('preview-container');
            const wrapper = document.getElementById('canvas-wrapper');
            const scale = Math.min((container.clientWidth - 60) / 1190, (container.clientHeight - 60) / 1684, 1);
            wrapper.style.transform = `scale(${scale})`;
        }
        window.addEventListener('resize', adjustPreviewScale);
        window.onload = () => {
            updatePoster();
            adjustPreviewScale();
        };
    </script>
</body>
</html>
