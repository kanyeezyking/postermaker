<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Album Poster Generator</title>
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; min-height: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background: #222;
            color: #fff;
        }
        #sidebar {
            width: 360px;
            flex: 0 0 360px;
            background: #181818;
            padding: 20px;
            overflow-y: auto;
            border-right: 1px solid #333;
        }
        #sidebar h2 {
            margin-top: 0;
            font-size: 1.1rem;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            color: #00ffcc;
        }
        .input-group { margin-bottom: 14px; }
        .template-field.is-hidden { display: none !important; }
        .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .input-group label {
            display: block;
            font-size: 0.75rem;
            margin-bottom: 5px;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .input-group input,
        .input-group select,
        .input-group textarea,
        button {
            width: 100%;
            padding: 10px;
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            border-radius: 4px;
            font-family: inherit;
        }
        .input-group textarea { resize: vertical; min-height: 180px; }
        .help-text {
            margin: 6px 0 0;
            color: #888;
            font-size: 0.75rem;
            line-height: 1.4;
        }
        .input-group input:focus,
        .input-group select:focus,
        .input-group textarea:focus {
            outline: none;
            border-color: #00ffcc;
        }
        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            color: #ddd;
            font-size: 0.9rem;
        }
        .checkbox-row input { width: auto; }
        .button-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        button {
            cursor: pointer;
            border-color: #00ffcc;
            background: #12352f;
            font-weight: 700;
        }
        button:hover { background: #17483f; }
        #preview-container {
            flex: 1 1 auto;
            min-width: 0;
            min-height: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: auto;
            background: #111;
        }
        #canvas-stage {
            position: relative;
            flex: 0 0 auto;
        }
        #canvas-wrapper {
            width: 595px;
            height: 842px;
            background: #fff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            position: absolute;
            top: 0;
            left: 0;
            overflow: hidden;
            transform-origin: top left;
        }
        #canvas-wrapper > svg { display: block; width: 100%; height: 100%; }
        iframe { width: 100%; height: 100%; border: none; display: block; }

        @media (max-width: 820px) {
            body {
                flex-direction: column;
                height: auto;
                min-height: 100dvh;
                overflow: auto;
            }
            #sidebar {
                width: 100%;
                flex: none;
                max-height: none;
                border-right: none;
                border-bottom: 1px solid #333;
            }
            #preview-container {
                width: 100%;
                height: 75dvh;
                min-height: 460px;
            }
        }
    </style>
</head>

Track Two Title

        function escapeXml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&apos;');
        }

        function parseTracks(value) {
            return String(value || '')
                .split('\n')
                .map(line => line.trim())
                .filter(Boolean);
        }

        function wrapWords(text, maxChars) {
            const words = String(text).trim().split(/\s+/).filter(Boolean);
            if (!words.length) return [''];

            const lines = [];
            let line = '';
            words.forEach(word => {
                if (word.length > maxChars) {
                    if (line) {
                        lines.push(line);
                        line = '';
                    }
                    for (let i = 0; i < word.length; i += maxChars) {
                        lines.push(word.slice(i, i + maxChars));
                    }
                    return;
                }

                const candidate = line ? `${line} ${word}` : word;
                if (candidate.length <= maxChars) {
                    line = candidate;
                } else {
                    if (line) lines.push(line);
                    line = word;
                }
            });
            if (line) lines.push(line);
            return lines;
        }

        function buildSwissTracklist(tracks) {
            const columns = [40, 125, 210, 295];
            const columnWidth = 76;
            const top = 668;
            const bottom = 766;
            const fontOptions = [8.5, 8, 7.5, 7, 6.5, 6, 5.5, 5];
            let chosen = null;

            for (const fontSize of fontOptions) {
                const lineHeight = fontSize + 2.2;
                const maxChars = Math.max(10, Math.floor(columnWidth / (fontSize * 0.54)));
                const capacity = Math.floor((bottom - top) / lineHeight);
                const prepared = tracks.map((track, index) => ({
                    lines: wrapWords(`${String(index + 1).padStart(2, '0')}. ${track}`, maxChars)
                }));
                const requiredLines = prepared.reduce((sum, entry) => sum + entry.lines.length, 0);

                if (requiredLines <= capacity * columns.length) {
                    chosen = { fontSize, lineHeight, capacity, prepared };
                    break;
                }
            }

            if (!chosen) {
                const fontSize = 4.5;
                const lineHeight = 6;
                const maxChars = Math.max(10, Math.floor(columnWidth / (fontSize * 0.54)));

        function fitPreview() {
            const container = document.getElementById('preview-container');

        function colourDistance(a, b) {
            return Math.sqrt(
                Math.pow(a[0] - b[0], 2) +
                Math.pow(a[1] - b[1], 2) +
                Math.pow(a[2] - b[2], 2)
            );
        }

        function rgbToHex(rgb) {
            return '#' + rgb.map(value => value.toString(16).padStart(2, '0')).join('').toUpperCase();
        }

        function extractPalette(source) {
            return new Promise(resolve => {
                if (!source) {
                    paletteColors = ['#333333', '#666666', '#999999', '#CCCCCC'];
                    resolve();
                    return;
                }

                const image = new Image();
                if (/^https?:/i.test(source)) image.crossOrigin = 'anonymous';

                image.onload = () => {
                    try {
                        const canvas = document.createElement('canvas');
                        const size = 90;
                        canvas.width = size;
                        canvas.height = size;
                        const context = canvas.getContext('2d', { willReadFrequently: true });
                        context.drawImage(image, 0, 0, size, size);
                        const pixels = context.getImageData(0, 0, size, size).data;
                        const buckets = new Map();
                        const step = 24;

                        for (let i = 0; i < pixels.length; i += 16) {
                            if (pixels[i + 3] < 180) continue;
                            const rgb = [
                                Math.min(255, Math.round(pixels[i] / step) * step),
                                Math.min(255, Math.round(pixels[i + 1] / step) * step),
                                Math.min(255, Math.round(pixels[i + 2] / step) * step)
                            ];
                            const key = rgb.join(',');
                            buckets.set(key, (buckets.get(key) || 0) + 1);
                        }

                        const sorted = [...buckets.entries()]
                            .sort((a, b) => b[1] - a[1])
                            .map(([key]) => key.split(',').map(Number));

                        const selected = [];
                        for (const rgb of sorted) {
                            if (selected.every(existing => colourDistance(existing, rgb) > 48)) {
                                selected.push(rgb);
                            }
                            if (selected.length === 4) break;
                        }

                        while (selected.length < 4 && sorted[selected.length]) {
                            selected.push(sorted[selected.length]);
                        }

                        if (selected.length) {
                            paletteColors = selected.slice(0, 4).map(rgbToHex);
                            while (paletteColors.length < 4) paletteColors.push('#CCCCCC');
                        }
                    } catch (error) {
                        console.warn('Palette extraction was blocked for this image URL.', error);
                    }
                    resolve();
                };

                image.onerror = () => resolve();
                image.src = source;
            });
        }

        function safeFileName() {
            const artist = document.getElementById('artistName').value.trim();
            const title = document.getElementById('albumTitle').value.trim();
            return `${artist}-${title}`
                .replace(/[^a-z0-9-_]+/gi, '-')
                .replace(/^-+|-+$/g, '') || 'album-poster';
        }

        const embeddedImageCache = new Map();

        function blobToDataUrl(blob) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = () => reject(new Error('The image could not be read.'));
                reader.readAsDataURL(blob);
            });
        }

        function inferImageMime(source) {
            const cleanSource = source.split('?')[0].split('#')[0].toLowerCase();
            if (cleanSource.endsWith('.png')) return 'image/png';
            if (cleanSource.endsWith('.jpg') || cleanSource.endsWith('.jpeg')) return 'image/jpeg';
            if (cleanSource.endsWith('.webp')) return 'image/webp';
            if (cleanSource.endsWith('.gif')) return 'image/gif';
            if (cleanSource.endsWith('.svg')) return 'image/svg+xml';
            return 'image/png';
        }

        async function sourceToEmbeddedDataUrl(source) {
            if (!source || source.startsWith('data:')) return source;
            if (source.startsWith('#')) return source;

            if (!embeddedImageCache.has(source)) {
                const conversion = (async () => {
                    const response = await fetch(source, {
                        mode: 'cors',
                        credentials: 'omit',
                        cache: 'force-cache'
                    });

                    if (!response.ok) {
                        throw new Error(`Image request failed with status ${response.status}.`);
                    }

                    let blob = await response.blob();
                    if (!blob.type || !blob.type.startsWith('image/')) {
                        blob = blob.slice(0, blob.size, inferImageMime(source));
                    }
                    return blobToDataUrl(blob);
                })();

                embeddedImageCache.set(source, conversion);
                conversion.catch(() => embeddedImageCache.delete(source));
            }

            return embeddedImageCache.get(source);
        }

        async function embedCssImageUrls(value) {
            if (!value || !value.includes('url(')) return value;

            const matches = [...value.matchAll(/url\((['"]?)(.*?)\1\)/g)];
            let result = value;

            for (const match of matches) {
                const source = match[2].trim();
                if (!source || source.startsWith('data:') || source.startsWith('#')) continue;

                const embeddedSource = await sourceToEmbeddedDataUrl(source);
                result = result.replace(match[0], `url("${embeddedSource}")`);
            }

            return result;
        }

        async function getDirectPosterSvgString(svg) {
            const clone = svg.cloneNode(true);
            const xlinkNamespace = 'http://www.w3.org/1999/xlink';
            clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
            clone.setAttributeNS('http://www.w3.org/2000/xmlns/', 'xmlns:xlink', xlinkNamespace);
            clone.setAttribute('viewBox', '0 0 595 842');
            clone.setAttribute('width', '595');
            clone.setAttribute('height', '842');

            const imageElements = [...clone.querySelectorAll('image')];
            await Promise.all(imageElements.map(async imageElement => {
                const source = imageElement.getAttribute('href')
                    || imageElement.getAttributeNS(xlinkNamespace, 'href')
                    || imageElement.getAttribute('xlink:href');

                if (!source || source.startsWith('#')) return;

                const embeddedSource = await sourceToEmbeddedDataUrl(source);
                imageElement.setAttribute('href', embeddedSource);
                imageElement.setAttributeNS(xlinkNamespace, 'xlink:href', embeddedSource);
            }));

            return new XMLSerializer().serializeToString(clone);
        }

        async function getIframePosterSvgString(iframe) {
            const iframeDocument = iframe?.contentDocument || iframe?.contentWindow?.document;
            if (!iframeDocument?.documentElement) return null;

            if (iframeDocument.fonts?.ready) {
                try { await iframeDocument.fonts.ready; } catch (_) {}
            }

            const clone = iframeDocument.documentElement.cloneNode(true);
            clone.setAttribute('xmlns', 'http://www.w3.org/1999/xhtml');

            clone.querySelectorAll('script').forEach(script => script.remove());

            for (const styleElement of clone.querySelectorAll('style')) {
                styleElement.textContent = await embedCssImageUrls(styleElement.textContent || '');
            }

            for (const styledElement of clone.querySelectorAll('[style]')) {
                styledElement.setAttribute(
                    'style',
                    await embedCssImageUrls(styledElement.getAttribute('style') || '')
                );
            }

            for (const imageElement of clone.querySelectorAll('img')) {
                const source = imageElement.getAttribute('src');
                if (source) imageElement.setAttribute('src', await sourceToEmbeddedDataUrl(source));
            }

            const serializedDocument = new XMLSerializer().serializeToString(clone);
            return `<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 595 842" width="595" height="842"><foreignObject x="0" y="0" width="595" height="842">${serializedDocument}</foreignObject></svg>`;
        }

        async function getPosterSvgString() {

        function crc32(bytes) {
            let crc = 0xFFFFFFFF;
            for (let index = 0; index < bytes.length; index++) {
                crc ^= bytes[index];
                for (let bit = 0; bit < 8; bit++) {
                    crc = (crc >>> 1) ^ ((crc & 1) ? 0xEDB88320 : 0);
                }
            }
            return (crc ^ 0xFFFFFFFF) >>> 0;
        }

        function writeUint32(target, offset, value) {
            target[offset] = (value >>> 24) & 0xFF;
            target[offset + 1] = (value >>> 16) & 0xFF;
            target[offset + 2] = (value >>> 8) & 0xFF;
            target[offset + 3] = value & 0xFF;
        }

        async function addPngDensityMetadata(blob, dpi = 300) {
            const original = new Uint8Array(await blob.arrayBuffer());
            const pngSignature = [137, 80, 78, 71, 13, 10, 26, 10];
            if (original.length < 33 || !pngSignature.every((byte, index) => original[index] === byte)) {
                return blob;
            }

            const pixelsPerMetre = Math.round(dpi / 0.0254);
            const chunk = new Uint8Array(21);
            writeUint32(chunk, 0, 9);
            chunk.set([112, 72, 89, 115], 4); // pHYs
            writeUint32(chunk, 8, pixelsPerMetre);
            writeUint32(chunk, 12, pixelsPerMetre);
            chunk[16] = 1;
            writeUint32(chunk, 17, crc32(chunk.slice(4, 17)));

            const output = new Uint8Array(original.length + chunk.length);
            output.set(original.slice(0, 33), 0);
            output.set(chunk, 33);
            output.set(original.slice(33), 54);
            return new Blob([output], { type: 'image/png' });
        }

        async function downloadPng() {
            const button = document.getElementById('downloadPng');
            setDownloadButtonBusy(button, true, 'Save PNG');

            try {
                const svgString = await getPosterSvgString();
                if (!svgString) {
                    alert('The poster preview could not be prepared for PNG saving.');
                    return;
                }

                const svgBlob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
                const svgUrl = URL.createObjectURL(svgBlob);

                try {
                    const renderedImage = await new Promise((resolve, reject) => {
                        const image = new Image();
                        image.onload = () => resolve(image);
                        image.onerror = () => reject(new Error('The embedded SVG could not be rendered.'));
                        image.src = svgUrl;
                    });

                    const canvas = document.createElement('canvas');
                    canvas.width = 4961;
                    canvas.height = 7016;
                    const context = canvas.getContext('2d');
                    context.fillStyle = '#F4F4F0';
                    context.fillRect(0, 0, canvas.width, canvas.height);
                    context.drawImage(renderedImage, 0, 0, canvas.width, canvas.height);

                    const pngBlob = await new Promise((resolve, reject) => {
                        canvas.toBlob(blob => {
                            if (blob) resolve(blob);
                            else reject(new Error('The PNG could not be created.'));
                        }, 'image/png');
                    });

                    const a2PngBlob = await addPngDensityMetadata(pngBlob, 300);
                    downloadBlob(a2PngBlob, `${safeFileName()}-A2-300dpi.png`);
                } finally {
                    URL.revokeObjectURL(svgUrl);
                }
            } catch (error) {
                console.error(error);
                alert('A linked image could not be embedded. Use a direct public image link, or paste/upload the image itself.');
            } finally {
                setDownloadButtonBusy(button, false, 'Save PNG');
            }
        }

            input.addEventListener('paste', event => {
                const imageItem = [...(event.clipboardData?.items || [])].find(item => item.type.startsWith('image/'));
                if (!imageItem) return;
                event.preventDefault();
                const file = imageItem.getAsFile();
                readImageFile(file, source => {
                    input.value = '';
                    document.getElementById(config.upload).value = '';
                    config.set(source);
                });
            });
        });

        document.getElementById('templateSelect').addEventListener('change', updateSidebarFields);
        document.getElementById('downloadPng').addEventListener('click', downloadPng);
        document.getElementById('downloadSvg').addEventListener('click', downloadSvg);
        window.addEventListener('resize', fitPreview);

        if ('ResizeObserver' in window) {
            new ResizeObserver(fitPreview).observe(document.getElementById('preview-container'));
        }

        window.onload = () => {
            updateSidebarFields();
            updatePoster();
        };
    </script>
</body>
</html>
