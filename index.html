<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Album Poster Generator</title>
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; min-height: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background: #222;
            color: #fff;
        }
        #sidebar {
            width: 360px;
            flex: 0 0 360px;
            background: #181818;
            padding: 20px;
            overflow-y: auto;
            border-right: 1px solid #333;
        }
        #sidebar h2 {
            margin-top: 0;
            font-size: 1.1rem;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            color: #00ffcc;
        }
        .input-group { margin-bottom: 14px; }
        .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .input-group label {
            display: block;
            font-size: 0.75rem;
            margin-bottom: 5px;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .input-group input,
        .input-group select,
        .input-group textarea,
        button {
            width: 100%;
            padding: 10px;
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            border-radius: 4px;
            font-family: inherit;
        }
        .input-group textarea { resize: vertical; min-height: 180px; }
        .help-text {
            margin: 6px 0 0;
            color: #888;
            font-size: 0.75rem;
            line-height: 1.4;
        }
        .input-group input:focus,
        .input-group select:focus,
        .input-group textarea:focus {
            outline: none;
            border-color: #00ffcc;
        }
        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            color: #ddd;
            font-size: 0.9rem;
        }
        .checkbox-row input { width: auto; }
        .button-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        button {
            cursor: pointer;
            border-color: #00ffcc;
            background: #12352f;
            font-weight: 700;
        }
        button:hover { background: #17483f; }
        #preview-container {
            flex: 1 1 auto;
            min-width: 0;
            min-height: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: auto;
            background: #111;
        }
        #canvas-stage {
            position: relative;
            flex: 0 0 auto;
        }
        #canvas-wrapper {
            width: 595px;
            height: 842px;
            background: #fff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            position: absolute;
            top: 0;
            left: 0;
            overflow: hidden;
            transform-origin: top left;
        }
        #canvas-wrapper > svg { display: block; width: 100%; height: 100%; }
        iframe { width: 100%; height: 100%; border: none; display: block; }

        @media (max-width: 820px) {
            body {
                flex-direction: column;
                height: auto;
                min-height: 100dvh;
                overflow: auto;
            }
            #sidebar {
                width: 100%;
                flex: none;
                max-height: none;
                border-right: none;
                border-bottom: 1px solid #333;
            }
            #preview-container {
                width: 100%;
                height: 75dvh;
                min-height: 460px;
            }
        }
    </style>
</head>
<body>
    <div id="sidebar">
        <h2>Poster Generator</h2>

        <div class="input-group">
            <label for="templateSelect">Select Template</label>
            <select id="templateSelect">
                <option value="1">Template 1: Swiss / Minimalist</option>
                <option value="2">Template 2: Y2K / Cyber Streetwear</option>
                <option value="3">Template 3: Vintage Vinyl Frame</option>
                <option value="4">Template 4: Editorial / Magazine Style</option>
                <option value="5">Template 5: Neo-Brutalist Grid</option>
                <option value="6">Template 6: MPC Sampler / Classic Hip-Hop</option>
                <option value="7">Template 7: Director's Cut Storyboard</option>
                <option value="8">Template 8: Chicago Soul / Vinyl Sleeve</option>
                <option value="9">Template 9: Modern Brutalist / Experimental</option>
                <option value="10">Template 10: Lyrical Typography Focus</option>
            </select>
        </div>

        <div class="input-group">
            <label for="artistName">Artist Name</label>
            <input type="text" id="artistName" value="[ ARTIST NAME ]">
        </div>

        <div class="input-group">
            <label for="albumTitle">Album Title</label>
            <input type="text" id="albumTitle" value="[ ALBUM TITLE ]">
        </div>

        <div class="input-group">
            <label for="producerName">Producer / Label</label>
            <input type="text" id="producerName" value="[ PRODUCER ]">
        </div>

        <div class="input-row">
            <div class="input-group">
                <label for="releaseYear">Release Year</label>
                <input type="text" id="releaseYear" value="2026">
            </div>
            <div class="input-group">
                <label for="catalogNumber">Catalog Number</label>
                <input type="text" id="catalogNumber" value="0001">
            </div>
        </div>

        <div class="input-group">
            <label for="artworkUpload">Artwork Image Upload</label>
            <input type="file" id="artworkUpload" accept="image/*">
        </div>

        <div class="input-group">
            <label for="artworkUrl">Or Artwork Image URL</label>
            <input type="text" id="artworkUrl" placeholder="https://example.com/image.jpg">
        </div>

        <div class="input-group">
            <label for="spotifyCodeUpload">Spotify Code Image Upload</label>
            <input type="file" id="spotifyCodeUpload" accept="image/*">
        </div>

        <div class="input-group">
            <label for="spotifyCodeUrl">Or Spotify Code Image URL</label>
            <input type="text" id="spotifyCodeUrl" placeholder="https://example.com/spotify-code.png">
        </div>

        <div class="input-group">
            <label for="tracklist">Tracklist (One per line)</label>
            <textarea id="tracklist">SIDE A
Track One Title
Track Two Title

SIDE B
Track Three Title
Track Four Title
Track Five Title
Track Six Title</textarea>
            <p class="help-text">Put SIDE A, SIDE B, SIDE C and so on on their own lines. Each side can contain any number of tracks.</p>
        </div>

        <div class="button-row">
            <button type="button" id="downloadPng">Save PNG</button>
            <button type="button" id="downloadSvg">Save SVG</button>
        </div>
    </div>

    <div id="preview-container">
        <div id="canvas-stage">
            <div id="canvas-wrapper"></div>
        </div>
    </div>

            .center-piece h1 { font-family: sans-serif; font-size: 22pt; margin: 0 0 5mm 0; font-weight: 900; text-transform: uppercase; }
            .center-piece p { font-size: 10pt; margin: 0 0 8mm 0; font-weight: bold; }
            .art-square { width: 70mm; height: 70mm; margin: 0 auto; background: #fff url('{{ARTWORK_URL}}') center/cover; border: 1px solid #0d0d2b; }
            .bottom-info { position: absolute; bottom: 15mm; left: 15mm; right: 15mm; z-index: 2; font-family: sans-serif; font-size: 8pt; border-top: 1px solid rgba(230, 230, 250, 0.3); padding-top: 5mm; }
            </style></head>
            <body>
                <div class="lyrics-bg">[ LYRICS OVERLAY TEXT CONTAINER ]</div>
                <div class="center-piece">
                    <h1>{{ALBUM_TITLE}}</h1>
                    <p>BY {{ARTIST_NAME}}</p>
                    <div class="art-square"></div>
                </div>
                <div class="bottom-info">
                    TRACKLIST: {{TRACKLIST_INLINE}} | PROD: {{PRODUCER}}
                </div>
            </body></html>`
        };

        let artworkSource = '';
        let spotifySource = '';
        let paletteColors = ['#333333', '#666666', '#999999', '#CCCCCC'];

        function escapeXml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&apos;');
        }

        function parseTracklist(value) {
            const entries = [];
            const tracks = [];
            let sideTrackNumber = 0;
            let globalTrackNumber = 0;
            let insideSide = false;

            String(value || '')
                .split('\n')
                .map(line => line.trim())
                .filter(Boolean)
                .forEach(line => {
                    const sideMatch = line.match(/^side\s+(.+?)[\s:.-]*$/i);

                    if (sideMatch) {
                        const sideLabel = sideMatch[1].trim().toUpperCase();
                        entries.push({ type: 'side', text: `SIDE ${sideLabel}` });
                        sideTrackNumber = 0;
                        insideSide = true;
                        return;
                    }

                    globalTrackNumber++;
                    sideTrackNumber++;
                    const number = insideSide ? sideTrackNumber : globalTrackNumber;
                    tracks.push(line);
                    entries.push({
                        type: 'track',
                        raw: line,
                        text: `${String(number).padStart(2, '0')}. ${line}`
                    });
                });

            return { entries, tracks };
        }

        function wrapWords(text, maxChars) {
            const words = String(text).trim().split(/\s+/).filter(Boolean);
            if (!words.length) return [''];

            const lines = [];
            let line = '';
            words.forEach(word => {
                if (word.length > maxChars) {
                    if (line) {
                        lines.push(line);
                        line = '';
                    }
                    for (let i = 0; i < word.length; i += maxChars) {
                        lines.push(word.slice(i, i + maxChars));
                    }
                    return;
                }

                const candidate = line ? `${line} ${word}` : word;
                if (candidate.length <= maxChars) {
                    line = candidate;
                } else {
                    if (line) lines.push(line);
                    line = word;
                }
            });
            if (line) lines.push(line);
            return lines;
        }

        function buildSwissTracklist(entries) {
            const columns = [40, 125, 210, 295];
            const columnWidth = 76;
            const top = 668;
            const bottom = 766;
            const fontOptions = [8.5, 8, 7.5, 7, 6.5, 6, 5.5, 5];
            let chosen = null;

            for (const fontSize of fontOptions) {
                const lineHeight = fontSize + 2.2;
                const maxChars = Math.max(10, Math.floor(columnWidth / (fontSize * 0.54)));
                const capacity = Math.floor((bottom - top) / lineHeight);
                const prepared = entries.map(entry => ({
                    ...entry,
                    lines: wrapWords(entry.text, maxChars)
                }));
                const requiredLines = prepared.reduce(
                    (sum, entry) => sum + entry.lines.length + (entry.type === 'side' ? 0.35 : 0),
                    0
                );

                if (requiredLines <= capacity * columns.length) {
                    chosen = { fontSize, lineHeight, capacity, prepared };
                    break;
                }
            }

            if (!chosen) {
                const fontSize = 4.5;
                const lineHeight = 6;
                const maxChars = Math.max(10, Math.floor(columnWidth / (fontSize * 0.54)));
                chosen = {
                    fontSize,
                    lineHeight,
                    capacity: Math.floor((bottom - top) / lineHeight),
                    prepared: entries.map(entry => ({ ...entry, lines: wrapWords(entry.text, maxChars) }))
                };
            }

            let column = 0;
            let usedLines = 0;
            let svg = '';

            chosen.prepared.forEach((entry, entryIndex) => {
                const nextEntry = chosen.prepared[entryIndex + 1];
                const sideSpacing = entry.type === 'side' && usedLines > 0 ? 0.35 : 0;
                const keepWithFirstTrack = entry.type === 'side' && nextEntry?.type === 'track'
                    ? nextEntry.lines.length
                    : 0;
                const preferredBlockSize = entry.lines.length + sideSpacing + keepWithFirstTrack;

                if (usedLines + preferredBlockSize > chosen.capacity && column < columns.length - 1) {
                    column++;
                    usedLines = 0;
                }

                if (entry.type === 'side' && usedLines > 0) usedLines += 0.35;

                entry.lines.forEach(line => {
                    if (usedLines >= chosen.capacity && column < columns.length - 1) {
                        column++;
                        usedLines = 0;
                    }
                    if (column >= columns.length || usedLines >= chosen.capacity) return;

                    const y = top + (usedLines * chosen.lineHeight);
                    const isSide = entry.type === 'side';
                    svg += `<text x="${columns[column]}" y="${y.toFixed(1)}" font-family="Helvetica, Arial, sans-serif" font-size="${isSide ? chosen.fontSize + 0.4 : chosen.fontSize}" font-weight="${isSide ? 'bold' : 'normal'}" letter-spacing="${isSide ? '0.8' : '0'}" fill="${isSide ? '#111111' : '#444444'}">${escapeXml(line)}</text>\n`;
                    usedLines++;
                });
            });

            return svg;
        }

        function updatePoster() {
            const templateId = document.getElementById('templateSelect').value;
            const artist = document.getElementById('artistName').value;
            const title = document.getElementById('albumTitle').value;
            const producer = document.getElementById('producerName').value;
            const releaseYear = document.getElementById('releaseYear').value;
            const catalogNumber = document.getElementById('catalogNumber').value;
            const artworkUrl = artworkSource || document.getElementById('artworkUrl').value.trim();
            const spotifyImage = spotifySource || document.getElementById('spotifyCodeUrl').value.trim();
            const parsedTracklist = parseTracklist(document.getElementById('tracklist').value);
            const tracks = parsedTracklist.tracks;

            let code = templates[templateId];

            let svgCol = buildSwissTracklist(parsedTracklist.entries);
            let svgGrid2 = '';
            let svgCenter = '';
            let svgEditorial = '';
            let svgBrutal = '';
            let htmlList = '';
            let htmlBrutal = '';
            let inlineTracks = tracks.map(escapeXml).join(' • ');

            tracks.forEach((track, i) => {
                const safeTrack = escapeXml(track);
                const num = (i + 1).toString().padStart(2, '0');
                if (i < 6) {
                    const x = i < 3 ? 50 : 280;
                    const y = 675 + ((i % 3) * 20);
                    svgGrid2 += `<text x="${x}" y="${y}" font-family="'Courier New', monospace" font-size="11" fill="#FFFFFF">${num}. ${safeTrack}</text>\n`;
                }
                htmlList += `${num}. ${safeTrack} <br>`;
                htmlBrutal += `<div class="track">${num}. ${safeTrack}</div>`;
                if (i < 5) svgCenter += `<text x="297" y="${615 + (i * 20)}" font-family="'Times New Roman', serif" font-size="11" fill="#2C221E" text-anchor="middle">${i + 1}. ${safeTrack}</text>\n`;
                if (i < 5) svgEditorial += `<text x="390" y="${250 + (i * 30)}" font-family="Helvetica, sans-serif" font-size="10" fill="#FF4500">0${i + 1}</text><text x="415" y="${250 + (i * 30)}" font-family="Helvetica, sans-serif" font-size="10" fill="#DDDDDD">${safeTrack}</text>\n`;
                if (i < 5) svgBrutal += `<text x="40" y="${570 + (i * 25)}" font-family="Courier, monospace" font-size="11" font-weight="bold" fill="#000000">${num}. ${safeTrack}</text>\n`;
            });

            code = code
                .replace(/{{ARTIST_NAME}}/g, escapeXml(artist))
                .replace(/{{ALBUM_TITLE}}/g, escapeXml(title))
                .replace(/{{PRODUCER}}/g, escapeXml(producer))
                .replace(/{{RELEASE_YEAR}}/g, escapeXml(releaseYear))
                .replace(/{{CATALOG_NUMBER}}/g, escapeXml(catalogNumber))
                .replace(/{{ARTWORK_URL}}/g, escapeXml(artworkUrl))
                .replace(/{{SPOTIFY_IMAGE}}/g, escapeXml(spotifyImage))
                .replace(/{{PALETTE_1}}/g, paletteColors[0])
                .replace(/{{PALETTE_2}}/g, paletteColors[1])
                .replace(/{{PALETTE_3}}/g, paletteColors[2])
                .replace(/{{PALETTE_4}}/g, paletteColors[3])
                .replace(/{{TRACKLIST_SVG_COLUMN}}/g, svgCol)
                .replace(/{{TRACKLIST_SVG_GRID_2}}/g, svgGrid2)
                .replace(/{{TRACKLIST_SVG_CENTER}}/g, svgCenter)
                .replace(/{{TRACKLIST_SVG_EDITORIAL}}/g, svgEditorial)
                .replace(/{{TRACKLIST_SVG_BRUTALIST}}/g, svgBrutal)
                .replace(/{{TRACKLIST_HTML}}/g, htmlList)
                .replace(/{{TRACKLIST_HTML_BRUTALIST}}/g, htmlBrutal)
                .replace(/{{TRACKLIST_INLINE}}/g, inlineTracks)
                .replace(/{{TRACK_1}}/g, escapeXml(tracks[0] || ''))
                .replace(/{{TRACK_2}}/g, escapeXml(tracks[1] || ''))
                .replace(/{{TRACK_3}}/g, escapeXml(tracks[2] || ''))
                .replace(/{{TRACK_4}}/g, escapeXml(tracks[3] || ''));

            const wrapper = document.getElementById('canvas-wrapper');
            if (code.includes('<svg')) {
                wrapper.innerHTML = code;
            } else {
                wrapper.innerHTML = '<iframe title="Poster preview"></iframe>';
                const iframe = wrapper.querySelector('iframe');
                iframe.contentWindow.document.open();
                iframe.contentWindow.document.write(code);
                iframe.contentWindow.document.close();
            }

            fitPreview();
        }

        function fitPreview() {
            const container = document.getElementById('preview-container');
            const stage = document.getElementById('canvas-stage');
            const wrapper = document.getElementById('canvas-wrapper');
            if (!container || !stage || !wrapper) return;

            const availableWidth = Math.max(100, container.clientWidth - 40);
            const availableHeight = Math.max(100, container.clientHeight - 40);
            const scale = Math.min(availableWidth / 595, availableHeight / 842, 1);

            stage.style.width = `${595 * scale}px`;
            stage.style.height = `${842 * scale}px`;
            wrapper.style.transform = `scale(${scale})`;
        }

        function readImageFile(file, callback) {
            if (!file) return;
            const reader = new FileReader();
            reader.onload = event => callback(event.target.result);
            reader.readAsDataURL(file);
        }

        function colourDistance(a, b) {
            return Math.sqrt(
                Math.pow(a[0] - b[0], 2) +
                Math.pow(a[1] - b[1], 2) +
                Math.pow(a[2] - b[2], 2)
            );
        }

        function rgbToHex(rgb) {
            return '#' + rgb.map(value => value.toString(16).padStart(2, '0')).join('').toUpperCase();
        }

        function extractPalette(source) {
            return new Promise(resolve => {
                if (!source) {
                    paletteColors = ['#333333', '#666666', '#999999', '#CCCCCC'];
                    resolve();
                    return;
                }

                const image = new Image();
                if (/^https?:/i.test(source)) image.crossOrigin = 'anonymous';

                image.onload = () => {
                    try {
                        const canvas = document.createElement('canvas');
                        const size = 90;
                        canvas.width = size;
                        canvas.height = size;
                        const context = canvas.getContext('2d', { willReadFrequently: true });
                        context.drawImage(image, 0, 0, size, size);
                        const pixels = context.getImageData(0, 0, size, size).data;
                        const buckets = new Map();
                        const step = 24;

                        for (let i = 0; i < pixels.length; i += 16) {
                            if (pixels[i + 3] < 180) continue;
                            const rgb = [
                                Math.min(255, Math.round(pixels[i] / step) * step),
                                Math.min(255, Math.round(pixels[i + 1] / step) * step),
                                Math.min(255, Math.round(pixels[i + 2] / step) * step)
                            ];
                            const key = rgb.join(',');
                            buckets.set(key, (buckets.get(key) || 0) + 1);
                        }

                        const sorted = [...buckets.entries()]
                            .sort((a, b) => b[1] - a[1])
                            .map(([key]) => key.split(',').map(Number));

                        const selected = [];
                        for (const rgb of sorted) {
                            if (selected.every(existing => colourDistance(existing, rgb) > 48)) {
                                selected.push(rgb);
                            }
                            if (selected.length === 4) break;
                        }

                        while (selected.length < 4 && sorted[selected.length]) {
                            selected.push(sorted[selected.length]);
                        }

                        if (selected.length) {
                            paletteColors = selected.slice(0, 4).map(rgbToHex);
                            while (paletteColors.length < 4) paletteColors.push('#CCCCCC');
                        }
                    } catch (error) {
                        console.warn('Palette extraction was blocked for this image URL.', error);
                    }
                    resolve();
                };

                image.onerror = () => resolve();
                image.src = source;
            });
        }

        function safeFileName() {
            const artist = document.getElementById('artistName').value.trim();
            const title = document.getElementById('albumTitle').value.trim();
            return `${artist}-${title}`
                .replace(/[^a-z0-9-_]+/gi, '-')
                .replace(/^-+|-+$/g, '') || 'album-poster';
        }

        function getPosterSvgString() {
            const svg = document.querySelector('#canvas-wrapper svg');
            if (!svg) return null;
            const clone = svg.cloneNode(true);
            clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
            clone.setAttribute('width', '595');
            clone.setAttribute('height', '842');
            return new XMLSerializer().serializeToString(clone);
        }

        function downloadBlob(blob, filename) {
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            link.href = url;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            link.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        function downloadSvg() {
            const svgString = getPosterSvgString();
            if (!svgString) {
                alert('SVG saving is available for poster templates 1 to 5.');
                return;
            }
            downloadBlob(new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' }), `${safeFileName()}.svg`);
        }

        function downloadPng() {
            const svgString = getPosterSvgString();
            if (!svgString) {
                alert('PNG saving is available for poster templates 1 to 5.');
                return;
            }

            const svgBlob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
            const svgUrl = URL.createObjectURL(svgBlob);
            const image = new Image();

            image.onload = () => {
                const canvas = document.createElement('canvas');
                canvas.width = 1190;
                canvas.height = 1684;
                const context = canvas.getContext('2d');
                context.fillStyle = '#F4F4F0';
                context.fillRect(0, 0, canvas.width, canvas.height);
                context.drawImage(image, 0, 0, canvas.width, canvas.height);

                try {
                    canvas.toBlob(blob => {
                        URL.revokeObjectURL(svgUrl);
                        if (!blob) {
                            alert('The PNG could not be created. Upload the artwork file instead of using an image URL.');
                            return;
                        }
                        downloadBlob(blob, `${safeFileName()}.png`);
                    }, 'image/png');
                } catch (error) {
                    URL.revokeObjectURL(svgUrl);
                    alert('The browser blocked PNG saving for that image URL. Upload the artwork file instead.');
                }
            };

            image.onerror = () => {
                URL.revokeObjectURL(svgUrl);
                alert('The PNG could not be created. Upload the artwork file instead of using an image URL.');
            };

            image.src = svgUrl;
        }

        document.querySelectorAll('#sidebar input:not([type="file"]), #sidebar textarea, #sidebar select').forEach(element => {
            element.addEventListener('input', updatePoster);
            element.addEventListener('change', updatePoster);
        });

        document.getElementById('artworkUpload').addEventListener('change', event => {
            readImageFile(event.target.files[0], async source => {
                artworkSource = source;
                document.getElementById('artworkUrl').value = '';
                await extractPalette(source);
                updatePoster();
            });
        });

        document.getElementById('artworkUrl').addEventListener('change', async event => {
            artworkSource = '';
            await extractPalette(event.target.value.trim());
            updatePoster();
        });

        document.getElementById('spotifyCodeUpload').addEventListener('change', event => {
            readImageFile(event.target.files[0], source => {
                spotifySource = source;
                document.getElementById('spotifyCodeUrl').value = '';
                updatePoster();
            });
        });

        document.getElementById('spotifyCodeUrl').addEventListener('input', event => {
            spotifySource = '';
            document.getElementById('spotifyCodeUpload').value = '';
            updatePoster();
        });

        document.getElementById('downloadPng').addEventListener('click', downloadPng);
        document.getElementById('downloadSvg').addEventListener('click', downloadSvg);
        window.addEventListener('resize', fitPreview);

        if ('ResizeObserver' in window) {
            new ResizeObserver(fitPreview).observe(document.getElementById('preview-container'));
        }

        window.onload = updatePoster;
    </script>
</body>
</html>
