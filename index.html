<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Album Art & Visual Treatment Generator</title>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --text-main: #ffffff;
            --text-muted: #888888;
            --accent: #ff4500;
            --border-color: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- LAYOUT --- */
        #app-container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        /* --- TEMPLATE SELECTOR (LEFT) --- */
        #template-selector {
            width: 250px;
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            padding: 20px;
            overflow-y: auto;
        }

        .template-btn {
            display: block;
            width: 100%;
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 12px;
            margin-bottom: 10px;
            text-align: left;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s;
            font-size: 14px;
        }

        .template-btn:hover, .template-btn.active {
            border-color: var(--text-main);
            color: var(--text-main);
            background-color: rgba(255, 255, 255, 0.05);
        }

        /* --- PREVIEW AREA (CENTER) --- */
        #preview-area {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #0a0a0a;
            overflow: auto;
            padding: 40px;
        }

        #art-board {
            width: 600px;
            height: 800px;
            background-color: #fff;
            color: #000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        /* --- SIDEBAR EDITOR (RIGHT) --- */
        #editor-sidebar {
            width: 350px;
            background-color: var(--panel-bg);
            border-left: 1px solid var(--border-color);
            padding: 20px;
            overflow-y: auto;
        }

        .sidebar-header {
            margin-bottom: 24px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
            font-weight: 600;
            letter-spacing: 1px;
        }

        .control-group {
            margin-bottom: 20px;
        }

        .control-group label {
            display: block;
            font-size: 12px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .control-group input[type="text"],
        .control-group textarea {
            width: 100%;
            background-color: rgba(255,255,255,0.05);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px;
            border-radius: 4px;
            font-size: 14px;
        }

        .control-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .track-input-group {
            display: flex;
            margin-bottom: 8px;
            gap: 8px;
        }

        /* --- TEMPLATE SPECIFIC STYLES --- */
        
        /* Template: Director's Cut (Code_Generated_Image (3).png) */
        .tpl-directors-cut {
            background-color: #1a1a1a;
            color: #dcdcdc;
            padding: 40px;
            font-family: monospace;
        }
        .tpl-directors-cut .header h1 {
            text-align: center;
            font-size: 32px;
            letter-spacing: 4px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }
        .tpl-directors-cut .header h2 {
            text-align: center;
            font-size: 14px;
            color: #888;
            border-bottom: 1px solid #444;
            padding-bottom: 20px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }
        .tpl-directors-cut .concept {
            font-size: 12px;
            margin-bottom: 30px;
            line-height: 1.5;
        }
        .tpl-directors-cut .scene-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .tpl-directors-cut .scene-row {
            display: flex;
            height: 100px;
            border: 1px solid #333;
        }
        .tpl-directors-cut .scene-text {
            flex: 2;
            padding: 10px;
            position: relative;
            background: #000;
        }
        .tpl-directors-cut .scene-meta {
            color: #ff3333;
            font-size: 10px;
            position: absolute;
            top: 10px;
            left: 10px;
        }
        .tpl-directors-cut .scene-lyric {
            position: absolute;
            bottom: 10px;
            left: 10px;
            font-style: italic;
            font-size: 12px;
        }
        .tpl-directors-cut .scene-art {
            flex: 1;
            background: #2a2a2a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: #666;
            border-left: 1px solid #333;
        }

        /* Template: Yellow Brutalism (gemini-svg (5).png) */
        .tpl-yellow-brut {
            background-color: #fce655;
            color: #000;
            padding: 20px;
            border: 10px solid #000;
            display: flex;
            flex-direction: column;
            font-weight: bold;
        }
        .tpl-yellow-brut .header-box {
            border-bottom: 5px solid #000;
            padding-bottom: 10px;
            margin-bottom: 10px;
        }
        .tpl-yellow-brut .header-box h1 { font-size: 42px; text-transform: uppercase; line-height: 1; }
        .tpl-yellow-brut .header-box h2 { font-size: 24px; text-transform: uppercase; }
        .tpl-yellow-brut .main-grid {
            display: grid;
            grid-template-columns: 2.5fr 1fr;
            gap: 10px;
            flex-grow: 1;
        }
        .tpl-yellow-brut .art-box {
            background: #fff;
            border: 5px solid #000;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 400px;
        }
        .tpl-yellow-brut .specs-box {
            border-left: 5px solid #000;
            padding-left: 10px;
            font-size: 12px;
        }
        .tpl-yellow-brut .tracklist-box {
            border-top: 5px solid #000;
            margin-top: 10px;
            padding-top: 10px;
        }
        .tpl-yellow-brut .tracklist-box ul { list-style: none; }
        .tpl-yellow-brut .tracklist-box li { margin-bottom: 8px; font-size: 14px; }

        /* Template: Clean Split (gemini-svg (1).png) */
        .tpl-clean-split {
            background-color: #f4f4f4;
            color: #111;
            padding: 40px;
        }
        .tpl-clean-split .top-text {
            margin-bottom: 20px;
        }
        .tpl-clean-split .top-text h1 { font-size: 36px; text-transform: uppercase; }
        .tpl-clean-split .top-text p { font-size: 14px; color: #555; }
        .tpl-clean-split .art-square {
            width: 100%;
            height: 450px;
            background: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
            margin-bottom: 30px;
        }
        .tpl-clean-split .bottom-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
            font-size: 12px;
        }
        .tpl-clean-split ul { list-style: none; }
        .tpl-clean-split li { margin-bottom: 6px; }

        /* Template: Vinyl Sleeve (gemini-svg (3).png) */
        .tpl-vinyl {
            background-color: #e8e3d3;
            color: #3b3631;
            padding: 30px;
            border: 15px solid #3b3631;
            text-align: center;
            font-family: 'Times New Roman', Times, serif;
        }
        .tpl-vinyl h1 { font-size: 40px; margin-bottom: 5px; text-transform: uppercase; }
        .tpl-vinyl .sub { font-style: italic; margin-bottom: 30px; }
        .tpl-vinyl .art-container {
            width: 80%;
            height: 400px;
            margin: 0 auto 30px auto;
            border: 2px solid #3b3631;
            background: #d1ccbc;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
    </style>
</head>
<body>

    <div id="app-container">
        
        <!-- LEFT: Template Selection -->
        <aside id="template-selector">
            <div class="sidebar-header">TEMPLATES</div>
            <div id="template-list"></div>
        </aside>

        <!-- CENTER: Live Preview -->
        <main id="preview-area">
            <div id="art-board">
                <!-- Content injected via JS -->
            </div>
        </main>

        <!-- RIGHT: The Core Editing Sidebar -->
        <aside id="editor-sidebar">
            <div class="sidebar-header">EDIT PROPERTIES</div>
            
            <div class="control-group">
                <label>Artist Name</label>
                <input type="text" id="edit-artist" oninput="updateState('artist', this.value)">
            </div>
            
            <div class="control-group">
                <label>Album / Project Title</label>
                <input type="text" id="edit-album" oninput="updateState('album', this.value)">
            </div>

            <div class="control-group">
                <label>Concept / Notes (For Storyboard)</label>
                <textarea id="edit-concept" oninput="updateState('concept', this.value)"></textarea>
            </div>

            <div class="control-group">
                <label>Tracklist / Lyrics</label>
                <div id="track-inputs"></div>
                <button onclick="addTrack()" style="margin-top: 10px; padding: 5px 10px; background: #333; color: white; border: none; cursor: pointer; border-radius: 3px;">+ Add Line</button>
            </div>
        </aside>

    </div>

    <script>
        // --- STATE MANAGEMENT ---
        // Pre-loaded with data fitting the Director's Cut structure and typical rollout specs
        const state = {
            activeTemplate: 'directors-cut',
            artist: "Kanye West",
            album: "Bully",
            concept: "CONCEPT: Rapid-fire visual transition. The transition structure applies to every individual line of the song. No exceptions.",
            tracks: [
                "I just touched down in the city",
                "Got the whole crew rolling with me",
                "Lights flashing, camera action",
                "We ain't looking for a reaction",
                "Building empires from the ground up"
            ]
        };

        // --- TEMPLATE DEFINITIONS ---
        // Referencing the requested images from the prompt
        const templates = {
            'directors-cut': {
                name: "Director's Cut Visuals",
                sourceFile: "Code_Generated_Image (3).png",
                render: (s) => `
                    <div class="tpl-directors-cut" style="height: 100%;">
                        <div class="header">
                            <h1>[ ${s.album} ]</h1>
                            <h2>DIRECTOR's CUT VISUAL TREATMENT</h2>
                        </div>
                        <div class="concept">${s.concept}</div>
                        <div class="scene-grid">
                            ${s.tracks.slice(0, 5).map((track, i) => `
                                <div class="scene-row">
                                    <div class="scene-text">
                                        <div class="scene-meta">SCENE 0${i+1} - 0:0${i*3}</div>
                                        <div class="scene-lyric">"[ ${track} ]"</div>
                                    </div>
                                    <div class="scene-art">[ SCENE ART ]</div>
                                </div>
                            `).join('')}
                        </div>
                        <div style="position: absolute; bottom: 30px; font-size: 10px; color: #666;">
                            ARTIST: [ ${s.artist} ] | SPOTIFY CODE: ||| | || || | || |
                        </div>
                    </div>
                `
            },
            'yellow-brutalism': {
                name: "Yellow Specifications",
                sourceFile: "gemini-svg (5).png",
                render: (s) => `
                    <div class="tpl-yellow-brut" style="height: 100%;">
                        <div class="header-box">
                            <h1>[ ${s.artist} ]</h1>
                            <h2>[ ${s.album} ]</h2>
                        </div>
                        <div class="main-grid">
                            <div class="art-col">
                                <div class="art-box">[ ARTWORK HERE ]</div>
                                <div class="tracklist-box">
                                    <p style="margin-bottom: 10px;">SIDE A / SIDE B TRACKLIST</p>
                                    <ul>
                                        ${s.tracks.map((t, i) => `<li>0${i+1}. [ ${t.substring(0, 15)}... ]</li>`).join('')}
                                    </ul>
                                </div>
                            </div>
                            <div class="specs-col">
                                <div class="specs-box">
                                    <p>SPECIFICATIONS</p><br>
                                    <p>GENRE: [ HIP HOP ]</p>
                                    <p>BPM: [ 88 ]</p>
                                </div>
                            </div>
                        </div>
                    </div>
                `
            },
            'clean-split': {
                name: "Clean Layout",
                sourceFile: "gemini-svg (1).png",
                render: (s) => `
                    <div class="tpl-clean-split" style="height: 100%;">
                        <div class="top-text">
                            <h1>[ ${s.album} ]</h1>
                            <p>[ ${s.artist} ] • [ 2026 ]</p>
                        </div>
                        <div class="art-square">[ INSERT ALBUM ARTWORK HERE ]</div>
                        <div class="bottom-grid">
                            <div>
                                <p style="font-weight: bold; margin-bottom: 10px;">SIDE A</p>
                                <ul>
                                    ${s.tracks.slice(0,4).map((t, i) => `<li>0${i+1}. [ ${t.substring(0,12)} ] — 00:00</li>`).join('')}
                                </ul>
                            </div>
                            <div>
                                <p style="font-weight: bold; margin-bottom: 10px;">SIDE B</p>
                                <ul>
                                    ${s.tracks.slice(4,8).map((t, i) => `<li>0${i+5}. [ ${t.substring(0,12)} ] — 00:00</li>`).join('')}
                                </ul>
                            </div>
                        </div>
                    </div>
                `
            },
            'vinyl-sleeve': {
                name: "Vintage Vinyl Sleeve",
                sourceFile: "gemini-svg (3).png",
                render: (s) => `
                    <div class="tpl-vinyl" style="height: 100%;">
                        <h1>[ ${s.album} ]</h1>
                        <div class="sub">A Long Playing Record by [ ${s.artist} ]</div>
                        <div class="art-container">[ INSERT ALBUM COVER ]</div>
                        <div style="font-size: 14px; border-top: 1px solid #3b3631; padding-top: 15px;">
                            — TRACK LISTING —<br><br>
                            ${s.tracks.map((t, i) => `${i+1}. ${t.substring(0,10)}`).join(' • ')}
                        </div>
                    </div>
                `
            }
            // Additional architecture ready for Code_Generated_Image (4).png, Code_Generated_Image (2).png, etc.
        };

        // --- CORE LOGIC ---

        function initApp() {
            // Build Template Selector
            const selector = document.getElementById('template-list');
            for (const [key, tpl] of Object.entries(templates)) {
                const btn = document.createElement('button');
                btn.className = `template-btn ${key === state.activeTemplate ? 'active' : ''}`;
                btn.innerText = tpl.name;
                btn.onclick = () => selectTemplate(key);
                selector.appendChild(btn);
            }

            // Sync initial state to sidebar inputs
            document.getElementById('edit-artist').value = state.artist;
            document.getElementById('edit-album').value = state.album;
            document.getElementById('edit-concept').value = state.concept;
            
            renderTrackInputs();
            renderPreview();
        }

        function selectTemplate(templateKey) {
            state.activeTemplate = templateKey;
            
            // Update UI buttons
            document.querySelectorAll('.template-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            renderPreview();
        }

        function updateState(key, value) {
            state[key] = value;
            renderPreview();
        }

        function updateTrack(index, value) {
            state.tracks[index] = value;
            renderPreview();
        }

        function addTrack() {
            state.tracks.push(`New Track ${state.tracks.length + 1}`);
            renderTrackInputs();
            renderPreview();
        }

        function removeTrack(index) {
            state.tracks.splice(index, 1);
            renderTrackInputs();
            renderPreview();
        }

        function renderTrackInputs() {
            const container = document.getElementById('track-inputs');
            container.innerHTML = '';
            
            state.tracks.forEach((track, index) => {
                const div = document.createElement('div');
                div.className = 'track-input-group';
                
                const input = document.createElement('input');
                input.type = 'text';
                input.value = track;
                input.oninput = (e) => updateTrack(index, e.target.value);
                
                const delBtn = document.createElement('button');
                delBtn.innerText = 'X';
                delBtn.style.padding = '0 10px';
                delBtn.style.background = '#442222';
                delBtn.style.color = 'white';
                delBtn.style.border = 'none';
                delBtn.style.cursor = 'pointer';
                delBtn.onclick = () => removeTrack(index);
                
                div.appendChild(input);
                div.appendChild(delBtn);
                container.appendChild(div);
            });
        }

        function renderPreview() {
            const board = document.getElementById('art-board');
            const template = templates[state.activeTemplate];
            
            if (template) {
                board.innerHTML = template.render(state);
            }
        }

        // Initialize on load
        window.onload = initApp;

    </script>
</body>
</html>
