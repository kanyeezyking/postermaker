<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Album Poster Generator</title>
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; min-height: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background: #222;
            color: #fff;
        }
        #sidebar {
            width: 360px;
            flex: 0 0 360px;
            background: #181818;
            padding: 20px;
            overflow-y: auto;
            border-right: 1px solid #333;
        }
        #sidebar h2 {
            margin-top: 0;
            font-size: 1.1rem;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            color: #00ffcc;
        }
        .input-group { margin-bottom: 14px; }
        .template-field.is-hidden { display: none !important; }
        .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .input-group label {
            display: block;
            font-size: 0.75rem;
            margin-bottom: 5px;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .input-group input,
        .input-group select,
        .input-group textarea,
        button {
            width: 100%;
            padding: 10px;
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            border-radius: 4px;
            font-family: inherit;
        }
        .input-group textarea { resize: vertical; min-height: 180px; }
        .help-text {
            margin: 6px 0 0;
            color: #888;
            font-size: 0.75rem;
            line-height: 1.4;
        }
        .input-group input:focus,
        .input-group select:focus,
        .input-group textarea:focus {
            outline: none;
            border-color: #00ffcc;
        }
        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            color: #ddd;
            font-size: 0.9rem;
        }
        .checkbox-row input { width: auto; }
        .button-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        button {
            cursor: pointer;
            border-color: #00ffcc;
            background: #12352f;
            font-weight: 700;
        }
        button:hover { background: #17483f; }
        #preview-container {
            flex: 1 1 auto;
            min-width: 0;
            min-height: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: auto;
            background: #111;
        }
        #canvas-stage {
            position: relative;
            flex: 0 0 auto;
        }
        #canvas-wrapper {
            width: 595px;
            height: 842px;
            background: #fff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            position: absolute;
            top: 0;
            left: 0;
            overflow: hidden;
            transform-origin: top left;
        }
        #canvas-wrapper > svg { display: block; width: 100%; height: 100%; }
        iframe { width: 100%; height: 100%; border: none; display: block; }

        @media (max-width: 820px) {
            body {
                flex-direction: column;
                height: auto;
                min-height: 100dvh;
                overflow: auto;
            }
            #sidebar {
                width: 100%;
                flex: none;
                max-height: none;
                border-right: none;
                border-bottom: 1px solid #333;
            }
            #preview-container {
                width: 100%;
                height: 75dvh;
                min-height: 460px;
            }
        }
    </style>
</head>
<body>
    <div id="sidebar">
        <h2>Poster Generator</h2>

        <div class="input-group">
            <label for="templateSelect">Select Template</label>
            <select id="templateSelect">
                <option value="1">Template 1: Swiss / Minimalist</option>
                <option value="2">Template 2: Y2K / Cyber Streetwear</option>
                <option value="3">Template 3: Vintage Vinyl Frame</option>
                <option value="4">Template 4: Editorial / Magazine Style</option>
                <option value="5">Template 5: Neo-Brutalist Grid</option>
                <option value="6">Template 6: MPC Sampler / Classic Hip-Hop</option>
                <option value="8">Template 8: Chicago Soul / Vinyl Sleeve</option>
                <option value="9">Template 9: Modern Brutalist / Experimental</option>
                <option value="10">Template 10: Lyrical Typography Focus</option>
            </select>
        </div>

        <div class="input-group">
            <label for="artistName">Artist Name</label>
            <input type="text" id="artistName" value="[ ARTIST NAME ]">
        </div>

        <div class="input-group">
            <label for="albumTitle">Album Title</label>
            <input type="text" id="albumTitle" value="[ ALBUM TITLE ]">
        </div>

        <div class="input-group template-field" data-templates="1 3 5 10">
            <label for="producerName">Producer / Label</label>
            <input type="text" id="producerName" value="[ PRODUCER ]">
        </div>

        <div class="input-row template-field" data-templates="1">
            <div class="input-group">
                <label for="releaseYear">Release Year</label>
                <input type="text" id="releaseYear" value="2026">
            </div>
            <div class="input-group">
                <label for="catalogNumber">Catalog Number</label>
                <input type="text" id="catalogNumber" value="0001">
            </div>
        </div>

        <div class="input-group">
            <label for="artworkUpload">Artwork Image Upload</label>
            <input type="file" id="artworkUpload" accept="image/*">
        </div>

        <div class="input-group">
            <label for="artworkUrl">Or Paste Artwork Image URL</label>
            <input type="text" id="artworkUrl" placeholder="https://example.com/image.jpg">
        </div>

        <div class="input-group template-field" data-templates="1 4">
            <label for="spotifyCodeUpload">Spotify Code Image Upload</label>
            <input type="file" id="spotifyCodeUpload" accept="image/*">
        </div>

        <div class="input-group template-field" data-templates="1 4">
            <label for="spotifyCodeUrl">Or Paste Spotify Code Image URL</label>
            <input type="text" id="spotifyCodeUrl" placeholder="https://example.com/spotify-code.png">
        </div>

        <div class="input-group template-field" data-templates="2 5">
            <label for="barcodeUpload">Barcode Image Upload</label>
            <input type="file" id="barcodeUpload" accept="image/*">
        </div>

        <div class="input-group template-field" data-templates="2 5">
            <label for="barcodeUrl">Or Paste Barcode Image URL</label>
            <input type="text" id="barcodeUrl" placeholder="Paste an image link or image from clipboard">
        </div>

        <div class="input-group template-field" data-templates="3">
            <label for="artistSignatureUpload">Artist Signature Image Upload</label>
            <input type="file" id="artistSignatureUpload" accept="image/*">
        </div>

        <div class="input-group template-field" data-templates="3">
            <label for="artistSignatureUrl">Or Paste Artist Signature Image URL</label>
            <input type="text" id="artistSignatureUrl" placeholder="Paste an image link or image from clipboard">
        </div>

        <div class="input-group template-field" data-templates="3">
            <label for="producerSignatureUpload">Producer Signature Image Upload</label>
            <input type="file" id="producerSignatureUpload" accept="image/*">
        </div>

        <div class="input-group template-field" data-templates="3">
            <label for="producerSignatureUrl">Or Paste Producer Signature Image URL</label>
            <input type="text" id="producerSignatureUrl" placeholder="Paste an image link or image from clipboard">
        </div>

        <div class="input-group template-field" data-templates="5">
            <label for="logoUpload">Logo Image Upload</label>
            <input type="file" id="logoUpload" accept="image/*">
        </div>

        <div class="input-group template-field" data-templates="5">
            <label for="logoUrl">Or Paste Logo Image URL</label>
            <input type="text" id="logoUrl" placeholder="Paste an image link or image from clipboard">
        </div>

        <div class="input-group template-field" data-templates="10">
            <label for="lyrics">Background Lyrics</label>
            <textarea id="lyrics" placeholder="Paste lyrics here, one or more lines...">Lyrics go here. Add as much text as you want for the background.</textarea>
        </div>

        <div class="input-group">
            <label for="tracklist">Tracklist (One per line)</label>
            <textarea id="tracklist">Track One Title
Track Two Title
Track Three Title
Track Four Title
Track Five Title
Track Six Title
Track Seven Title
Track Eight Title</textarea>
        </div>

        <div class="button-row">
            <button type="button" id="downloadPng">Save PNG</button>
            <button type="button" id="downloadSvg">Save SVG</button>
        </div>
    </div>

    <div id="preview-container">
        <div id="canvas-stage">
            <div id="canvas-wrapper"></div>
        </div>
    </div>

        function escapeXml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&apos;');

        function parseTracks(value) {

        function wrapWords(text, maxChars) {
            const words = String(text).trim().split(/\s+/).filter(Boolean);
            if (!words.length) return [''];

            const lines = [];
            let line = '';
            words.forEach(word => {
                if (word.length > maxChars) {
                    if (line) {
                        lines.push(line);
                        line = '';
                    }
                    for (let i = 0; i < word.length; i += maxChars) {
                        lines.push(word.slice(i, i + maxChars));
                    }
                    return;
                }

                const candidate = line ? `${line} ${word}` : word;
                if (candidate.length <= maxChars) {
                    line = candidate;
                } else {
                    if (line) lines.push(line);
                    line = word;
                }
            });
            if (line) lines.push(line);
            return lines;
        }

        function buildHtmlTrackColumns(tracks, options = {}) {
            const width = options.width || 480;
            const height = options.height || 180;
            const maxColumns = options.maxColumns || 4;
            const gap = options.gap || 16;
            const fontOptions = options.fontOptions || [14, 13, 12, 11, 10, 9, 8, 7, 6, 5, 4];
            let chosen = null;

            for (let columns = 1; columns <= maxColumns; columns++) {
                const columnWidth = (width - gap * (columns - 1)) / columns;
                for (const fontSize of fontOptions) {
                    const lineHeight = fontSize * 1.28;
                    const maxChars = Math.max(7, Math.floor(columnWidth / (fontSize * 0.56)));
                    const capacity = Math.max(1, Math.floor(height / lineHeight));
                    const prepared = tracks.map((track, index) => ({
                        lines: wrapWords(`${String(index + 1).padStart(2, '0')}. ${track}`, maxChars)
                    }));
                    const required = prepared.reduce((sum, entry) => sum + entry.lines.length, 0);
                    if (required <= capacity * columns) {
                        chosen = { columns, fontSize, lineHeight, capacity, prepared };
                        break;
                    }
                }
                if (chosen) break;
            }

            if (!chosen) {
                const columns = maxColumns;
                const fontSize = 3.5;
                const lineHeight = 4.5;
                const columnWidth = (width - gap * (columns - 1)) / columns;
                const maxChars = Math.max(7, Math.floor(columnWidth / (fontSize * 0.56)));
                chosen = {
                    columns,
                    fontSize,
                    lineHeight,
                    capacity: Math.max(1, Math.floor(height / lineHeight)),
                    prepared: tracks.map((track, index) => ({
                        lines: wrapWords(`${String(index + 1).padStart(2, '0')}. ${track}`, maxChars)
                    }))
                };
            }

            const columnLines = Array.from({ length: chosen.columns }, () => []);
            let column = 0;
            let used = 0;
            chosen.prepared.forEach(entry => {
                if (used + entry.lines.length > chosen.capacity && column < chosen.columns - 1) {
                    column++;
                    used = 0;
                }
                entry.lines.forEach(line => {
                    if (used >= chosen.capacity && column < chosen.columns - 1) {
                        column++;
                        used = 0;
                    }
                    if (column >= chosen.columns || used >= chosen.capacity) return;
                    columnLines[column].push(line);
                    used++;
                });
            });

            const columnsHtml = columnLines.map(lines =>
                `<div class="track-column">${lines.map(line => `<div class="track-line">${escapeXml(line)}</div>`).join('')}</div>`
            ).join('');

            return `<div class="track-columns" style="grid-template-columns:repeat(${chosen.columns}, minmax(0,1fr));font-size:${chosen.fontSize}px;line-height:${chosen.lineHeight}px">${columnsHtml}</div>`;
        }

        function fitPreview() {
            const container = document.getElementById('preview-container');
            const stage = document.getElementById('canvas-stage');
            const wrapper = document.getElementById('canvas-wrapper');
            if (!container || !stage || !wrapper) return;

            const availableWidth = Math.max(100, container.clientWidth - 40);
            const availableHeight = Math.max(100, container.clientHeight - 40);
            const scale = Math.min(availableWidth / 595, availableHeight / 842, 1);

            stage.style.width = `${595 * scale}px`;
            stage.style.height = `${842 * scale}px`;
            wrapper.style.transform = `scale(${scale})`;
        }

        function readImageFile(file, callback) {
            if (!file) return;
            const reader = new FileReader();
            reader.onload = event => callback(event.target.result);
            reader.readAsDataURL(file);
        }

        function colourDistance(a, b) {
            return Math.sqrt(
                Math.pow(a[0] - b[0], 2) +
                Math.pow(a[1] - b[1], 2) +
                Math.pow(a[2] - b[2], 2)
            );
        }

        function rgbToHex(rgb) {
            return '#' + rgb.map(value => value.toString(16).padStart(2, '0')).join('').toUpperCase();
        }

        function extractPalette(source) {
            return new Promise(resolve => {
                if (!source) {
                    paletteColors = ['#333333', '#666666', '#999999', '#CCCCCC'];
                    resolve();
                    return;
                }

                const image = new Image();
                if (/^https?:/i.test(source)) image.crossOrigin = 'anonymous';

                image.onload = () => {
                    try {
                        const canvas = document.createElement('canvas');
                        const size = 90;
                        canvas.width = size;
                        canvas.height = size;
                        const context = canvas.getContext('2d', { willReadFrequently: true });
                        context.drawImage(image, 0, 0, size, size);
                        const pixels = context.getImageData(0, 0, size, size).data;
                        const buckets = new Map();
                        const step = 24;

                        for (let i = 0; i < pixels.length; i += 16) {
                            if (pixels[i + 3] < 180) continue;
                            const rgb = [
                                Math.min(255, Math.round(pixels[i] / step) * step),
                                Math.min(255, Math.round(pixels[i + 1] / step) * step),
                                Math.min(255, Math.round(pixels[i + 2] / step) * step)
                            ];
                            const key = rgb.join(',');
                            buckets.set(key, (buckets.get(key) || 0) + 1);
                        }

                        const sorted = [...buckets.entries()]
                            .sort((a, b) => b[1] - a[1])
                            .map(([key]) => key.split(',').map(Number));

                        const selected = [];
                        for (const rgb of sorted) {
                            if (selected.every(existing => colourDistance(existing, rgb) > 48)) {
                                selected.push(rgb);
                            }
                            if (selected.length === 4) break;
                        }

                        while (selected.length < 4 && sorted[selected.length]) {
                            selected.push(sorted[selected.length]);
                        }

                        if (selected.length) {
                            paletteColors = selected.slice(0, 4).map(rgbToHex);
                            while (paletteColors.length < 4) paletteColors.push('#CCCCCC');
                        }
                    } catch (error) {
                        console.warn('Palette extraction was blocked for this image URL.', error);
                    }
                    resolve();
                };

                image.onerror = () => resolve();
                image.src = source;
            });
        }

        function safeFileName() {
            const artist = document.getElementById('artistName').value.trim();
            const title = document.getElementById('albumTitle').value.trim();
            return `${artist}-${title}`
                .replace(/[^a-z0-9-_]+/gi, '-')
                .replace(/^-+|-+$/g, '') || 'album-poster';
        }

        const embeddedImageCache = new Map();

        function blobToDataUrl(blob) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = () => reject(new Error('The image could not be read.'));
                reader.readAsDataURL(blob);
            });
        }

        function inferImageMime(source) {
            const cleanSource = source.split('?')[0].split('#')[0].toLowerCase();
            if (cleanSource.endsWith('.png')) return 'image/png';
            if (cleanSource.endsWith('.jpg') || cleanSource.endsWith('.jpeg')) return 'image/jpeg';
            if (cleanSource.endsWith('.webp')) return 'image/webp';
            if (cleanSource.endsWith('.gif')) return 'image/gif';
            if (cleanSource.endsWith('.svg')) return 'image/svg+xml';
            return 'image/png';
        }

        async function sourceToEmbeddedDataUrl(source) {
            if (!source || source.startsWith('data:')) return source;
            if (source.startsWith('#')) return source;

            if (!embeddedImageCache.has(source)) {
                const conversion = (async () => {
                    const response = await fetch(source, {
                        mode: 'cors',
                        credentials: 'omit',
                        cache: 'force-cache'
                    });

                    if (!response.ok) {
                        throw new Error(`Image request failed with status ${response.status}.`);
                    }

                    let blob = await response.blob();
                    if (!blob.type || !blob.type.startsWith('image/')) {
                        blob = blob.slice(0, blob.size, inferImageMime(source));
                    }
                    return blobToDataUrl(blob);
                })();

                embeddedImageCache.set(source, conversion);
                conversion.catch(() => embeddedImageCache.delete(source));
            }

            return embeddedImageCache.get(source);
        }

        async function getPosterSvgString() {
            const svg = document.querySelector('#canvas-wrapper svg');
            if (!svg) return null;

            const clone = svg.cloneNode(true);
            const xlinkNamespace = 'http://www.w3.org/1999/xlink';
            clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
            clone.setAttributeNS('http://www.w3.org/2000/xmlns/', 'xmlns:xlink', xlinkNamespace);
            clone.setAttribute('width', '595');
            clone.setAttribute('height', '842');

            const imageElements = [...clone.querySelectorAll('image')];
            await Promise.all(imageElements.map(async imageElement => {
                const source = imageElement.getAttribute('href')
                    || imageElement.getAttributeNS(xlinkNamespace, 'href')
                    || imageElement.getAttribute('xlink:href');

                if (!source || source.startsWith('#')) return;

                const embeddedSource = await sourceToEmbeddedDataUrl(source);
                imageElement.setAttribute('href', embeddedSource);
                imageElement.setAttributeNS(xlinkNamespace, 'xlink:href', embeddedSource);
            }));

            return new XMLSerializer().serializeToString(clone);
        }

        function downloadBlob(blob, filename) {
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            link.href = url;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            link.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        function setDownloadButtonBusy(button, busy, normalText) {
            button.disabled = busy;
            button.textContent = busy ? 'Preparing…' : normalText;
        }

        async function downloadSvg() {
            const button = document.getElementById('downloadSvg');
            setDownloadButtonBusy(button, true, 'Save SVG');

            try {
                const svgString = await getPosterSvgString();
                if (!svgString) {
                    alert('SVG saving is available for poster templates 1 to 5.');
                    return;
                }

                downloadBlob(
                    new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' }),
                    `${safeFileName()}.svg`
                );
            } catch (error) {
                console.error(error);
                alert('A linked image could not be embedded. Use a direct public image link, or paste/upload the image itself.');
            } finally {
                setDownloadButtonBusy(button, false, 'Save SVG');
            }
        }

        async function downloadPng() {
            const button = document.getElementById('downloadPng');
            setDownloadButtonBusy(button, true, 'Save PNG');

            try {
                const svgString = await getPosterSvgString();
                if (!svgString) {
                    alert('PNG saving is available for poster templates 1 to 5.');
                    return;
                }

                const svgBlob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
                const svgUrl = URL.createObjectURL(svgBlob);

                try {
                    const renderedImage = await new Promise((resolve, reject) => {
                        const image = new Image();
                        image.onload = () => resolve(image);
                        image.onerror = () => reject(new Error('The embedded SVG could not be rendered.'));
                        image.src = svgUrl;
                    });

                    const canvas = document.createElement('canvas');
                    canvas.width = 1190;
                    canvas.height = 1684;
                    const context = canvas.getContext('2d');
                    context.fillStyle = '#F4F4F0';
                    context.fillRect(0, 0, canvas.width, canvas.height);
                    context.drawImage(renderedImage, 0, 0, canvas.width, canvas.height);

                    const pngBlob = await new Promise((resolve, reject) => {
                        canvas.toBlob(blob => {
                            if (blob) resolve(blob);
                            else reject(new Error('The PNG could not be created.'));
                        }, 'image/png');
                    });

                    downloadBlob(pngBlob, `${safeFileName()}.png`);
                } finally {
                    URL.revokeObjectURL(svgUrl);
                }
            } catch (error) {
                console.error(error);
                alert('A linked image could not be embedded. Use a direct public image link, or paste/upload the image itself.');
            } finally {
                setDownloadButtonBusy(button, false, 'Save PNG');
            }
        }

        document.querySelectorAll('#sidebar input:not([type="file"]), #sidebar textarea, #sidebar select').forEach(element => {
            element.addEventListener('input', updatePoster);
            element.addEventListener('change', updatePoster);
        });

        document.getElementById('artworkUpload').addEventListener('change', event => {
            readImageFile(event.target.files[0], async source => {
                artworkSource = source;
                document.getElementById('artworkUrl').value = '';
                await extractPalette(source);
                updatePoster();
            });
        });

        let artworkUrlPaletteTimer;
        document.getElementById('artworkUrl').addEventListener('input', event => {
            artworkSource = '';
            clearTimeout(artworkUrlPaletteTimer);
            artworkUrlPaletteTimer = setTimeout(async () => {
                await extractPalette(event.target.value.trim());
                updatePoster();
            }, 350);
        });

        document.getElementById('artworkUrl').addEventListener('change', async event => {
            artworkSource = '';
            clearTimeout(artworkUrlPaletteTimer);
            await extractPalette(event.target.value.trim());
            updatePoster();
        });

        document.getElementById('spotifyCodeUpload').addEventListener('change', event => {
            readImageFile(event.target.files[0], source => {
                spotifySource = source;
                document.getElementById('spotifyCodeUrl').value = '';
                updatePoster();
            });
        });

        document.getElementById('spotifyCodeUrl').addEventListener('input', event => {
            spotifySource = '';
            document.getElementById('spotifyCodeUpload').value = '';
            updatePoster();
        });

        document.getElementById('barcodeUpload').addEventListener('change', event => {
            readImageFile(event.target.files[0], source => {
                barcodeSource = source;
                document.getElementById('barcodeUrl').value = '';
                updatePoster();
            });
        });

        document.getElementById('barcodeUrl').addEventListener('input', () => {
            barcodeSource = '';
            document.getElementById('barcodeUpload').value = '';
            updatePoster();
        });

        document.getElementById('artistSignatureUpload').addEventListener('change', event => {
            readImageFile(event.target.files[0], source => {
                artistSignatureSource = source;
                document.getElementById('artistSignatureUrl').value = '';
                updatePoster();
            });
        });

        document.getElementById('artistSignatureUrl').addEventListener('input', () => {
            artistSignatureSource = '';
            document.getElementById('artistSignatureUpload').value = '';
            updatePoster();
        });

        document.getElementById('producerSignatureUpload').addEventListener('change', event => {
            readImageFile(event.target.files[0], source => {
                producerSignatureSource = source;
                document.getElementById('producerSignatureUrl').value = '';
                updatePoster();
            });
        });

        document.getElementById('producerSignatureUrl').addEventListener('input', () => {
            producerSignatureSource = '';
            document.getElementById('producerSignatureUpload').value = '';
            updatePoster();
        });

        document.getElementById('logoUpload').addEventListener('change', event => {
            readImageFile(event.target.files[0], source => {
                logoSource = source;
                document.getElementById('logoUrl').value = '';
                updatePoster();
            });
        });

        document.getElementById('logoUrl').addEventListener('input', () => {
            logoSource = '';
            document.getElementById('logoUpload').value = '';
            updatePoster();
        });

        const clipboardImageTargets = {
            artworkUrl: { set: source => { artworkSource = source; extractPalette(source).then(updatePoster); }, upload: 'artworkUpload' },
            spotifyCodeUrl: { set: source => { spotifySource = source; updatePoster(); }, upload: 'spotifyCodeUpload' },
            barcodeUrl: { set: source => { barcodeSource = source; updatePoster(); }, upload: 'barcodeUpload' },
            artistSignatureUrl: { set: source => { artistSignatureSource = source; updatePoster(); }, upload: 'artistSignatureUpload' },
            producerSignatureUrl: { set: source => { producerSignatureSource = source; updatePoster(); }, upload: 'producerSignatureUpload' },
            logoUrl: { set: source => { logoSource = source; updatePoster(); }, upload: 'logoUpload' }
        };

        Object.entries(clipboardImageTargets).forEach(([inputId, config]) => {
            const input = document.getElementById(inputId);
            input.addEventListener('paste', event => {
                const imageItem = [...(event.clipboardData?.items || [])].find(item => item.type.startsWith('image/'));
                if (!imageItem) return;
                event.preventDefault();
                const file = imageItem.getAsFile();
                readImageFile(file, source => {
                    input.value = '';
                    document.getElementById(config.upload).value = '';
                    config.set(source);
                });
            });
        });

        document.getElementById('templateSelect').addEventListener('change', updateSidebarFields);
        document.getElementById('downloadPng').addEventListener('click', downloadPng);
        document.getElementById('downloadSvg').addEventListener('click', downloadSvg);
        window.addEventListener('resize', fitPreview);

        if ('ResizeObserver' in window) {
            new ResizeObserver(fitPreview).observe(document.getElementById('preview-container'));
        }

        window.onload = () => {
            updateSidebarFields();
            updatePoster();
        };
    </script>
</body>
</html>
