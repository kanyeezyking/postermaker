        #sidebar { width: 380px; background: #181818; padding: 20px; overflow-y: auto; border-right: 1px solid #333; flex-shrink: 0; }
        #sidebar h2 { margin-top: 0; font-size: 1.1rem; border-bottom: 1px solid #333; padding-bottom: 10px; color: #00ffcc; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 0.8rem; margin-bottom: 5px; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }
        .input-group input, .input-group select, .input-group textarea { width: 100%; padding: 10px; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 4px; font-family: inherit; }
        .input-group textarea { resize: vertical; min-height: 120px; }
        .input-group input:focus, .input-group select:focus, .input-group textarea:focus { outline: none; border-color: #00ffcc; }
        .file-input { padding: 5px !important; margin-top: 5px; font-size: 0.8rem; }
        #downloadBtn { width: 100%; padding: 12px; background: #00ffcc; color: #000; border: none; font-weight: bold; border-radius: 4px; cursor: pointer; margin-top: 10px; text-transform: uppercase; letter-spacing: 1px; }
        #downloadBtn:hover { background: #00cca3; }
        #preview-container { flex-grow: 1; display: flex; justify-content: center; align-items: center; padding: 30px; overflow: hidden; background: #111; }
        #canvas-wrapper { width: 1190px; height: 1684px; background: #fff; box-shadow: 0 10px 30px rgba(0,0,0,0.8); flex-shrink: 0; position: relative; overflow: hidden; transform-origin: center center; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>

        // Extract palette excluding white and near-white pixels
        function extractPaletteFromImage(imgUrl, callback) {
            const defaultPalette = ['#2b2b2b', '#555555', '#888888', '#aaaaaa'];
            if (!imgUrl) {
                callback(defaultPalette);
                return;
            }
            const img = new Image();
            img.crossOrigin = "Anonymous";
            img.src = imgUrl;
            img.onload = function() {
                try {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = 50;
                    canvas.height = 50;
                    ctx.drawImage(img, 0, 0, 50, 50);
                    const imgData = ctx.getImageData(0, 0, 50, 50).data;
                    
                    let colors = [];
                    for (let i = 0; i < imgData.length; i += 16) {
                        let r = imgData[i];
                        let g = imgData[i+1];
                        let b = imgData[i+2];
                        let a = imgData[i+3];
                        
                        if (a < 128) continue;
                        if (r > 215 && g > 215 && b > 215) continue;
                        
                        colors.push({ r, g, b });
                    }
                    
                    if (colors.length < 4) {
                        callback(defaultPalette);
                        return;
                    }

                    let step = Math.floor(colors.length / 4);
                    let p1 = `rgb(${colors[0].r}, ${colors[0].g}, ${colors[0].b})`;
                    let p2 = `rgb(${colors[step].r}, ${colors[step].g}, ${colors[step].b})`;
                    let p3 = `rgb(${colors[step * 2].r}, ${colors[step * 2].g}, ${colors[step * 2].b})`;
                    let p4 = `rgb(${colors[step * 3].r}, ${colors[step * 3].g}, ${colors[step * 3].b})`;

                    callback([p1, p2, p3, p4]);
                } catch(e) {
                    callback(defaultPalette);
                }
            };
            img.onerror = function() {
                callback(defaultPalette);
            };
        }

        // Convert external image URLs to Base64 Data URLs to prevent tainted canvas issues on PNG export
        function prepareImageUrl(url, callback) {
            if (!url || url.startsWith('data:') || url.startsWith('blob:')) {
                callback(url);
                return;
            }
            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.onload = function() {
                try {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.naturalWidth || 600;
                    canvas.height = img.naturalHeight || 600;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);
                    callback(canvas.toDataURL('image/png'));
                } catch (e) {
                    // CORS proxy fallback
                    const proxyUrl = 'https://images.weserv.nl/?url=' + encodeURIComponent(url);
                    const proxyImg = new Image();
                    proxyImg.crossOrigin = 'anonymous';
                    proxyImg.onload = function() {
                        const canvas = document.createElement('canvas');
                        canvas.width = proxyImg.naturalWidth || 600;
                        canvas.height = proxyImg.naturalHeight || 600;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(proxyImg, 0, 0);
                        callback(canvas.toDataURL('image/png'));
                    };
                    proxyImg.onerror = () => callback(url);
                    proxyImg.src = proxyUrl;
                }
            };
            img.onerror = function() {
                const proxyUrl = 'https://images.weserv.nl/?url=' + encodeURIComponent(url);
                const proxyImg = new Image();
                proxyImg.crossOrigin = 'anonymous';
                proxyImg.onload = function() {
                    const canvas = document.createElement('canvas');
                    canvas.width = proxyImg.naturalWidth || 600;
                    canvas.height = proxyImg.naturalHeight || 600;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(proxyImg, 0, 0);
                    callback(canvas.toDataURL('image/png'));
                };
                proxyImg.onerror = () => callback(url);
                proxyImg.src = proxyUrl;
            };
            img.src = url;
        }

        function updatePoster() {
            const templateId = document.getElementById('templateSelect').value;
            const artist = document.getElementById('artistName').value;
            const title = document.getElementById('albumTitle').value;
            const producer = document.getElementById('producerName').value;
            const year = document.getElementById('releaseYear').value;
            const catalogNo = document.getElementById('catalogNo').value;
            
            const rawArtworkUrl = uploadedArtworkUrl || document.getElementById('artworkUrl').value;
            const rawSpotifyCodeUrl = uploadedSpotifyCodeUrl || document.getElementById('spotifyCodeUrl').value;
            
            const rawTrackText = document.getElementById('tracklist').value;
            const lines = rawTrackText.split('\n');

            prepareImageUrl(rawArtworkUrl, (artworkUrl) => {
                prepareImageUrl(rawSpotifyCodeUrl, (spotifyCodeUrl) => {
                    extractPaletteFromImage(artworkUrl, (palette) => {
                        let code = templates[templateId] || templates[1];

                        // Parse Multi-Sides for Stacked Row Grid
                        let sides = [];
                        let currentSide = { title: "SIDE A", tracks: [] };
                        lines.forEach(line => {
                            let trimmed = line.trim();
                            if (!trimmed) return;
                            if (trimmed.toUpperCase().startsWith("SIDE") || trimmed.toUpperCase().startsWith("VOL") || trimmed.toUpperCase().startsWith("PART")) {
                                if (currentSide.tracks.length > 0 || currentSide.title !== "SIDE A") {
                                    sides.push(currentSide);
                                }
                                currentSide = { title: trimmed.toUpperCase(), tracks: [] };
                            } else {
                                currentSide.tracks.push(trimmed);
                            }
                        });
                        sides.push(currentSide);

                        // Template 1 Dynamic Sizing
                        let numRows = Math.ceil(sides.length / 2);
                        let maxTracks = Math.max(...sides.map(s => s.tracks.length), 1);
                        
                        let fontSize = 19;
                        let lineGap = 26;
                        let rowGap = 26;
                        
                        if (numRows >= 2 || maxTracks > 6) { fontSize = 15; lineGap = 21; rowGap = 21; }
                        if (numRows >= 3 || maxTracks > 9) { fontSize = 13; lineGap = 18; rowGap = 18; }
                        if (numRows >= 4 || maxTracks > 12) { fontSize = 11; lineGap = 15; rowGap = 15; }

                        let dynamicSidesSvg = '';
                        let col0X = 80;
                        let col1X = 630;
                        let currentY = 1175;

                        for (let i = 0; i < sides.length; i += 2) {
                            let sideLeft = sides[i];
                            let sideRight = sides[i + 1];

                            if (sideLeft) {
                                dynamicSidesSvg += `<text x="${col0X}" y="${currentY}" font-family="Helvetica, Arial, sans-serif" font-size="${fontSize + 2}" font-weight="bold" fill="#111111">${sideLeft.title}</text>\n`;
                                sideLeft.tracks.forEach((track, tIdx) => {
                                    let tNum = (tIdx + 1).toString().padStart(2, '0');
                                    let tY = currentY + lineGap + (tIdx * lineGap);
                                    dynamicSidesSvg += `<text x="${col0X}" y="${tY}" font-family="Helvetica, Arial, sans-serif" font-size="${fontSize}" fill="#444444">${tNum}. ${track}</text>\n`;
                                });
                            }

                            if (sideRight) {
                                dynamicSidesSvg += `<text x="${col1X}" y="${currentY}" font-family="Helvetica, Arial, sans-serif" font-size="${fontSize + 2}" font-weight="bold" fill="#111111">${sideRight.title}</text>\n`;
                                sideRight.tracks.forEach((track, tIdx) => {
                                    let tNum = (tIdx + 1).toString().padStart(2, '0');
                                    let tY = currentY + lineGap + (tIdx * lineGap);
                                    dynamicSidesSvg += `<text x="${col1X}" y="${tY}" font-family="Helvetica, Arial, sans-serif" font-size="${fontSize}" fill="#444444">${tNum}. ${track}</text>\n`;
                                });
                            }

                            let maxT = Math.max(
                                sideLeft ? sideLeft.tracks.length : 0,
                                sideRight ? sideRight.tracks.length : 0
                            );
                            currentY += lineGap + (maxT * lineGap) + rowGap;
                        }

                        // Template 2 Dynamic Tracklist Generation
                        let allTracks = [];
                        lines.forEach(l => {
                            let t = l.trim();
                            if (t && !t.toUpperCase().startsWith("SIDE") && !t.toUpperCase().startsWith("VOL") && !t.toUpperCase().startsWith("PART")) {
                                allTracks.push(t);
                            }
                        });

                        let svgGrid2 = '';
                        let t2YStart = 980;
                        let t2ColHeight = Math.ceil(allTracks.length / 2);
                        
                        allTracks.forEach((t, i) => {
                            let num = (i + 1).toString().padStart(2, '0');
                            let col = i >= t2ColHeight ? 1 : 0;
                            let rowIndex = i >= t2ColHeight ? i - t2ColHeight : i;
                            let x = col === 0 ? 100 : 640;
                            let y = t2YStart + (rowIndex * 38);
                            svgGrid2 += `<text x="${x}" y="${y}" font-family="'Courier New', monospace" font-size="18" fill="#FFFFFF">${num}. ${t}</text>\n`;
                        });

                        // Generic Tracklist for Templates 3-10
                        let genericTracklistSvg = '';
                        let gStartY = (templateId === '3' || templateId === '8') ? 970 : 900;
                        let gColHeight = Math.ceil(allTracks.length / 2);
                        
                        allTracks.forEach((t, i) => {
                            let num = (i + 1).toString().padStart(2, '0');
                            let col = i >= gColHeight ? 1 : 0;
                            let rowIndex = i >= gColHeight ? i - gColHeight : i;
                            let x = col === 0 ? 120 : 620;
                            let y = gStartY + (rowIndex * 36);
                            let textColor = (templateId === '6' || templateId === '7' || templateId === '9') ? '#CCCCCC' : '#333333';
                            genericTracklistSvg += `<text x="${x}" y="${y}" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="${textColor}">${num}. ${t}</text>\n`;
                        });

                        code = code
                            .replace(/{{ARTIST_NAME}}/g, artist)
                            .replace(/{{ALBUM_TITLE}}/g, title)
                            .replace(/{{PRODUCER}}/g, producer)
                            .replace(/{{RELEASE_YEAR}}/g, year)
                            .replace(/{{CATALOG_NO}}/g, catalogNo)
                            .replace(/{{ARTWORK_URL}}/g, artworkUrl)
                            .replace(/{{SPOTIFY_CODE_URL}}/g, spotifyCodeUrl)
                            .replace(/{{DYNAMIC_SIDES}}/g, dynamicSidesSvg)
                            .replace(/{{TRACKLIST_SVG_GRID_2}}/g, svgGrid2)
                            .replace(/{{TRACKLIST_GENERIC}}/g, genericTracklistSvg)
                            .replace(/{{PALETTE_1}}/g, palette[0])
                            .replace(/{{PALETTE_2}}/g, palette[1])
                            .replace(/{{PALETTE_3}}/g, palette[2])
                            .replace(/{{PALETTE_4}}/g, palette[3]);

                        const wrapper = document.getElementById('canvas-wrapper');
                        wrapper.innerHTML = code;
                    });
                });
            });
        }

        document.getElementById('artworkFile').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (evt) => {
                    uploadedArtworkUrl = evt.target.result;
                    document.getElementById('artworkUrl').value = '';
                    updatePoster();
                };
                reader.readAsDataURL(file);
            }
        });

        document.getElementById('spotifyCodeFile').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (evt) => {
                    uploadedSpotifyCodeUrl = evt.target.result;
                    document.getElementById('spotifyCodeUrl').value = '';
                    updatePoster();
                };
                reader.readAsDataURL(file);
            }
        });

        // High-Resolution PNG Export that preserves images & works great in Google Drive
        document.getElementById('downloadBtn').addEventListener('click', () => {
            const wrapper = document.getElementById('canvas-wrapper');
            let filename = document.getElementById('albumTitle').value.toLowerCase().replace(/[^a-z0-9]/g, '_') + '_a2_poster.png';
            
            const svgElement = wrapper.querySelector('svg');
            if (!svgElement) return;

            const svgString = new XMLSerializer().serializeToString(svgElement);
            const svgBlob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
            const DOMURL = window.URL || window.webkitURL || window;
            const url = DOMURL.createObjectURL(svgBlob);

            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                canvas.width = 1190;
                canvas.height = 1684;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0);
                DOMURL.revokeObjectURL(url);

                const pngUrl = canvas.toDataURL('image/png');
                const a = document.createElement('a');
                a.href = pngUrl;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            };
            img.src = url;
        });

        document.querySelectorAll('#sidebar input, #sidebar textarea, #sidebar select').forEach(el => {
            el.addEventListener('input', () => {
                if (el.id === 'artworkUrl') uploadedArtworkUrl = '';
                if (el.id === 'spotifyCodeUrl') uploadedSpotifyCodeUrl = '';
                updatePoster();
            });
            el.addEventListener('change', updatePoster);
        });

        function adjustPreviewScale() {
            const container = document.getElementById('preview-container');
            const wrapper = document.getElementById('canvas-wrapper');
            const scale = Math.min((container.clientWidth - 60) / 1190, (container.clientHeight - 60) / 1684, 1);
            wrapper.style.transform = `scale(${scale})`;
        }

        window.addEventListener('resize', adjustPreviewScale);
        window.onload = () => {
            updatePoster();
            adjustPreviewScale();
        };
    </script>
</body>
</html>
